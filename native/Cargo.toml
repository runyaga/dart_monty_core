[package]
name = "dart_monty_core_native"
version = "0.0.14"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "oracle"
path = "src/bin/oracle.rs"

[lib]
name = "dart_monty_core_native"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# monty v0.0.19 split its public surface: the `monty` crate went from 1321 to 306
# public items, and most of what we use moved to the new `monty-types` crate.
# See ~/dev/plans/monty-0.19-upgrade/artifacts/monty-api-diff-018-019.txt
#
# Note `monty_type_checking` was renamed to `monty-type-checking` upstream. The
# Rust path stays `monty_type_checking::` — cargo maps the hyphen to underscore.
#
# `monty-fs` is deliberately NOT a dependency: mounting moved host-side in 0.19
# (upstream #576), but this shim never used `monty::fs` — mounts are implemented
# on our side via OS-call handlers.
monty = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.19" }
monty-type-checking = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.19" }
monty-types = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.19" }
num-bigint = "0.4"
num-traits = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }

[features]
# Testing-only: exposes monty's synthetic `_test_cm()` context manager so the
# `with__cm_*` conformance fixtures can run. NEVER enabled in shipped builds —
# only the dedicated test-build scripts pass `--features test-hooks`.
test-hooks = ["monty/test-hooks"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
# Enable all pedantic lints, then allow specific exceptions
pedantic = { level = "warn", priority = -1 }

# Allowances (aligned with upstream pydantic/monty)
cast_precision_loss = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Our additions: FFI crate needs these allowed
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Extra lints beyond pedantic (from upstream monty + FFI safety)
dbg_macro = "warn"
use_self = "warn"
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
multiple_unsafe_ops_per_block = "warn"
or_fun_call = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
