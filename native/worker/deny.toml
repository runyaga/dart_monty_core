[advisories]
version = 2
# atomic-polyfill is unmaintained but comes from monty's transitive deps.
#
# The unic-* ignores (RUSTSEC-2025-0075/0080/0081/0094) were removed when we
# moved to monty v0.0.19: that release dropped the unic-* dependency chain
# entirely, so the entries no longer matched any crate and `cargo deny` warned
# on every run. Only unicode-* crates remain, which are unrelated.
ignore = [
    "RUSTSEC-2023-0089",
    # zip 0.6.6 and 8.6.0 come from monty's typeshed crates, which this lock must
    # keep as upstream's. The worker only reads an embedded archive in memory.
    # Added 2026-10-16; remove when the upstream pin moves to a fixed zip.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # zstd-safe 5.0.2 and zstd-sys 2.1.0 come only through zstd 0.11.2 <-
    # zip 0.6.6, a [build-dependencies] entry of upstream's monty-typeshed
    # 1.2.0. They are compiled for the build machine and run in that crate's
    # build script, so neither is in a shipped native or wasm worker.
    # RUSTSEC-2026-0410 concerns zstd-sys's malloc shim on wasm32, and zstd-sys
    # is never built for wasm32 here. RUSTSEC-2026-0403's fix needs zstd-safe
    # 8.2.0, which zip 0.6.6 cannot take, and this lock must stay upstream's.
    # These entries are removed when the upstream pin moves to a zip that
    # drops zstd 0.11.
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0410",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",    # minicbor, minicbor-serde (transitive via monty 1.1.0): permissive, OSI-approved
    "CC0-1.0",          # constant_time_eq (transitive via monty_type_checking)
    "ISC",
    "MPL-2.0",          # colored (transitive via monty_type_checking)
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"  # git deps don't specify version

[sources]
unknown-registry = "deny"
unknown-git = "allow"  # monty dependency is a git fork
