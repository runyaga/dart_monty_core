[toolchain]
channel = "stable"
# No `targets` list, deliberately. rustup installs every listed target the
# first time any cargo/rustc command runs in native/ -- including inside
# hook/build.dart, so every consumer (and every CI job that runs `dart test`)
# paid for a dozen cross-compile std libraries (~20 s) it never used.
#
# The host target ships with the toolchain, which is all a default build
# needs. Anything else is added where it is used:
#   - hook/build.dart: `rustup target add <triple>` for the triple it builds
#     (a no-op for the host; covers cross-arch desktop builds).
#   - wasm32-wasip1: tool/prebuild.sh and the `targets:` input of the CI jobs
#     that build it.
