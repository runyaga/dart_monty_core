# The manifest embedded in the package (lib/src/worker/worker_manifest_data.dart)
# must hold these hashes before the package is published. Run this workflow on
# the binary commit, then update the manifest in the following commit.
name: Release worker assets

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to assemble
        required: true
        type: string
      publish:
        description: Create and fill a draft release
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/release-worker.yaml'
      - 'tool/worker_release.dart'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/worker
          key: worker-release-${{ matrix.target }}-${{ hashFiles('native/worker/Cargo.lock') }}
      - run: dart pub get
      - name: Build worker files
        shell: bash
        run: bash tool/build_worker.sh
      - name: Pack worker files
        shell: bash
        run: >-
          dart run tool/worker_release.dart pack --target "${TARGET}"
          --bin-dir "lib/src/bin/${TARGET}" --out dist
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: worker-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  assemble:
    name: Assemble release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || github.event_name == 'pull_request' && 'v0.0.0-dryrun' || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: worker-*
          path: dist
          merge-multiple: true
      - name: Assemble and verify manifest
        run: |
          dart run tool/worker_release.dart manifest --tag "$TAG" --fragments dist --out dist/worker-manifest.json
          dart run tool/worker_release.dart verify --manifest dist/worker-manifest.json --assets dist > archives.txt
          {
            echo '| Archive | Bytes | SHA-256 |'
            echo '| --- | ---: | --- |'
            while read -r name bytes digest; do
              echo "| $name | $bytes | $digest |"
            done < archives.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-all
          path: |
            dist/*.gz
            dist/worker-manifest.json
          if-no-files-found: error

  publish:
    name: Create draft release
    needs: assemble
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-all
          path: dist
      - name: Create a draft when needed
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes ""
          fi
      - name: Upload release assets
        run: gh release upload "$TAG" dist/*.gz dist/worker-manifest.json --clobber
      - name: Verify downloaded release assets
        run: |
          mkdir served
          gh release download "$TAG" --dir served --pattern '*'
          dart run tool/worker_release.dart verify --manifest served/worker-manifest.json --assets served
