name: CI

on:
  # Manual re-run, any branch. Without this the ONLY way to make CI evaluate a
  # PR again is an artificial event -- a close/reopen, or an empty commit that
  # pollutes the diff. Measured: #162/#163/#164 sat with zero ci.yaml jobs and a
  # green tick because their base was outside the filter, and fixing the filter
  # did NOT re-evaluate them; editing a base branch fires no PR event. Three
  # close/reopens were needed to unstick them.
  #
  # `force_all: true` runs every job even where the path filter would skip it
  # (a dispatch has no label to ask with). The record cited by a release tag:
  # the TAG change is Markdown only, which the `changes` filter excludes.
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Run every job regardless of the path filter (release record)'
        type: boolean
        default: false
  push:
    # `integration/**` IS A RELEASE LINE, NOT A TOPIC BRANCH. Measured
    # 2026-09-16: SIX commits on integration/0.23 -- d6cf573, 38be183, e033b70,
    # 8251f10, 75b3f11, 39487ef -- had each run exactly ONE workflow, TruffleHog.
    # Every ci.yaml job was skipped, because a push to a non-main branch matched
    # no trigger here. The branch was validated only by the LOCAL gate, and a
    # local gate cannot see the ubuntu/x86_64 matrix CI runs.
    branches: [main, 'integration/**']
  pull_request:
    # NO BRANCH FILTER, DELIBERATELY. This was an allowlist --
    #   branches: [main, 'feat/**', 'solpi/**', 'integration/**', 'fix/**']
    # -- and an allowlist has to be edited every time someone invents a prefix.
    # It already failed twice that way. Measured: #162/#163/#164 targeted
    # `solpi/leg3-wip-...`, matched nothing here, and ran ZERO test/analyze/
    # ratchet jobs while showing green from `label` + `trufflehog` alone. That
    # is worse than red, because a reviewer reads green as validated. The list
    # was then widened to cover those, which fixed the instance and left the
    # class: a PR onto `perf/**`, `chore/**`, `docs/**` or anything else not yet
    # imagined still runs nothing.
    #
    # There is no branch a PR can target where running CI is the wrong answer,
    # so the correct filter is none. `push:` below keeps its filter because that
    # IS a deliberate choice -- main and the release lines, not every topic
    # branch push.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The dart_monty_parity commit the `parity` and `parity-e0` jobs run (one
# pin for both). A change meant to move parity bumps it in the same PR.
env:
  PARITY_PIN: 399676d78d01f55765ab7b0bae01335951a33b1b

# Read-only. No job posts checks or comments; a job that needs more grants it
# on itself (tool/check_workflow_tokens.py rejects writes here).
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Path filter — skip all downstream jobs when only docs/comments changed
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.override.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    # paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              # `example/**` IS CODE. Without it, editing only
              # example/*.dart left `code` false and `test-examples` (now the
              # example step of `test-ffi`) — the ONLY job that runs those
              # programs — did not run at all. A
              # broken example merged green, because the single check that
              # could catch it was the one the change switched off.
              #
              # Exactly the failure the `docs:` output below was added for,
              # one directory over. The examples are analysed and formatted
              # by the gate job, so they are code by every other measure
              # this workflow applies.
              - 'example/**'
              - 'native/**'
              # js/src/** is hashed by tool/check_asset_freshness.sh and is
              # the source of the committed worker/bridge assets; without it a
              # JS-only change skipped the freshness check and every WASM job.
              - 'js/**'
              # ffigen's own config: without it a change to ffigen.yaml alone
              # skipped the bindings drift check.
              - 'ffigen.yaml'
              - 'hook/**'
              - 'tool/**'
              - 'packages/**'
              - 'pubspec.*'
              - 'analysis_options.yaml'
              - 'dart_test.yaml'
              - '.github/**'
              - '!**.md'
            # Documentation is NOT "no CI". Three source-only checks are
            # doc-sensitive and a docs-only change can break any of them:
            #   check_page_versions.sh   5 published pages carry the version badge
            #   check_wire_contract.sh   docs/WIRE-CONTRACT.md vs the encoder
            #   check_fixture_links.sh   demo fixture links resolve
            # Without this output a docs-only PR skipped `gate` along with
            # everything else, so the checks most likely to catch a docs mistake
            # were exactly the ones a docs change switched off.
            docs:
              - '**.md'
              - 'docs/**'
              - 'mkdocs.yml'
              - 'mkdocs_docs/**'
      # Release override. A PR labelled `release`, or a dispatch with
      # `force_all: true`, makes `code` true whatever the filter said, so the
      # Markdown-only TAG change runs every job (a skipped job is not green).
      # The label is read from the event payload AND the live PR: a re-run
      # replays the original payload, so a label added after the PR opened
      # would otherwise never count. `docs` is left as the filter set it.
      - name: Apply the release override
        id: override
        env:
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FORCE_ALL: ${{ inputs.force_all }}
          PAYLOAD_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          code="$FILTER_CODE"
          reason=""
          if [ "$FORCE_ALL" = "true" ]; then
            code=true; reason="force_all input"
          fi
          labels="$(printf '%s' "$PAYLOAD_LABELS" | jq -r '.[]?' 2>/dev/null || true)"
          if [ -n "$PR_NUMBER" ]; then
            live="$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" --paginate --jq '.[].name' 2>/dev/null || true)"
            labels="$labels
          $live"
          fi
          if printf '%s\n' "$labels" | grep -qxF release; then
            code=true; reason="release label"
          fi
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "code=${code} (filter said ${FILTER_CODE}${reason:+; forced by ${reason}})"

  # ---------------------------------------------------------------------------
  # Stage 0 — the fast gate. Source-only invariants, no native build, no browser.
  # ---------------------------------------------------------------------------
  # WHY THIS JOB EXISTS. Fifteen of these checks are enforced by tool/gate.sh and
  # FIVE OF THEM RAN NOWHERE IN CI:
  #
  #   check_backend_parity.sh     no method may be a stub on one backend only
  #   check_exports_declared.sh   all 63 exported C symbols declared in the header
  #   check_forgery_coverage.sh   all 25 emittable wire tags have a forgery test
  #   check_wire_contract.sh      WIRE-CONTRACT.md matches the encoder, both ways
  #   check_workflows_valid.sh    actionlint over .github/workflows/
  #
  # A contributor who does not run tool/gate.sh locally could break any of them
  # and CI stayed green. The last one is the sharpest: it was ADDED because a
  # duplicate `env:` key made GitHub reject ci.yaml, which stopped the workflow
  # matching its own triggers -- thirteen commits with no CI at all, showing a
  # red X indistinguishable from a job failure (4d624f8..c49477e). The check
  # written to prevent a repeat was itself not running in CI.
  #
  # All sixteen are source-only. Measured in-container: the five above total
  # 168ms. The job is dominated by SDK setup, not by the checks.
  #
  # This job deliberately does NOT gate the others with `needs:`. Serialising the
  # happy path behind it would cost every green run ~35s to save a red run ~11
  # minutes. Restructuring the stage graph is a separate, larger change.
  gate:
    name: "gate · source-only · no-browser"
    needs: [changes]
    # code OR docs. This is the one job a docs-only change must still run.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Nothing in this job reads git history, so the checkout is shallow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      - name: Source-only invariants (count asserted below)
        run: |
          set -uo pipefail
          RC=0; RAN=0
          run(){ RAN=$((RAN+1)); if "$@"; then echo "OK:   $*"; else echo "FAIL: $*"; RC=1; fi; }

          run dart analyze --fatal-infos
          run dart format --line-length=80 --output=none --set-exit-if-changed lib/ test/ hook/ tool/
          run bash tool/check_asset_freshness.sh
          # The proto worker wasm's gzip -9 budget (5.75 MB; O7 measured 5.66).
          run bash tool/check_worker_wasm_size.sh
          run bash tool/check_wire_version.sh
          run node tool/check_wasm_arity.mjs
          run bash tool/check_exports_declared.sh
          run bash tool/check_forgery_coverage.sh
          run bash tool/check_wire_contract.sh
          run bash tool/check_workflows_valid.sh
          # Every third-party `uses:` pinned to a 40-hex commit SHA.
          run bash tool/check_action_pins.sh
          # A read-only top-level `permissions:` in every workflow, and
          # `persist-credentials: false` on every checkout.
          run python3 -I tool/check_workflow_tokens.py
          run bash tool/check_fixture_corpus.sh
          # Changelog fragments: format of changes/*.md and the PR rule's
          # negative controls. The PR-level rule is changelog-fragments.yml.
          run bash tool/check_changelog_fragments.sh --self-test
          # The coverage ratchet's controls (deleted vs vanished files, and
          # the lib-wide total over the files a change keeps).
          run bash tool/coverage_ratchet.sh --self-test
          # The ratchet's base ref per event: a push compares with its first
          # parent, so a merge that deletes lib files is DELETED, not VANISHED.
          run bash tool/ci_ratchet_base.sh --self-test
          run bash tool/check_fixture_links.sh
          run bash tool/check_page_versions.sh
          run bash tool/check_version_pin.sh
          # The upstream reference pin (pydantic/monty 1.1.0): shape only here;
          # the `upstream-pin` job below fetches and installs it.
          run python3 -I tool/check_upstream_pin.py
          # The frozen capability manifest (187 rows, 185 in scope): schema,
          # content hash and baseline totals.
          run python3 -I tool/check_capability_manifest.py
          # native/worker/ against the same pin: verbatim subprocess.rs, exact
          # monty crate pins, Cargo.lock a subset of upstream's. Offline; the
          # `upstream-pin` job checks the recorded hashes against upstream.
          run python3 -I tool/check_worker_mirror.py --local
          # ...and its negative controls: path, git, [patch], [replace] and
          # cargo-config overrides of upstream crates must each fail it.
          run python3 -I tool/test_check_worker_mirror.py
          run bash tool/check_no_vague_errors.sh
          run bash tool/check_backend_parity.sh
          run bash tool/check_api_exercised.sh
          run bash tool/check_api_absent.sh
          # Nothing under lib/src/worker/ exported or in a public signature,
          # and the exported names and their public members equal
          # tool/export-golden.txt; then the check's own controls. Not `dart run`, which would build the
          # native crate through the build hook.
          run dart --packages=.dart_tool/package_config.json tool/check_export_boundary.dart
          run dart --packages=.dart_tool/package_config.json tool/check_export_boundary.dart --self-test
          # Both of these catch things a Dart test PROVABLY cannot, and both ran
          # only on a laptop until now:
          #   hierarchy_registry — Dart has no runtime reflection on web or AOT,
          #     so no test can enumerate a sealed class's subtypes. A 27th
          #     subtype added without a sample leaves the matrix green.
          #   hook_dependencies — measured: with the hook's .rs dependency loop
          #     removed, editing a .rs never reaches the dylib and `dart test`
          #     passes 30/30 against a stale artefact.
          run bash tool/check_hierarchy_registry.sh
          run bash tool/check_hook_dependencies.sh
          # One Dart SDK across every workflow pin: dart format output differs
          # between SDK releases, so mismatched pins mean format wars.
          run bash tool/check_sdk_pin.sh

          # The gate's own skip-but-green guard. A renamed or deleted script must
          # be a RED, not a silently shorter list that still exits 0 -- which is
          # the exact shape this repo has been bitten by twice.
          [ "$RAN" -eq 32 ] || { echo "FAIL: expected 32 checks, ran $RAN"; RC=1; }
          echo "ran $RAN checks, rc=$RC"
          exit $RC

  # ---------------------------------------------------------------------------
  # The upstream reference pin, verified against its sources
  # ---------------------------------------------------------------------------
  # Every parity number is measured against pydantic/monty 1.1.0 (the oracle),
  # so the pin is checked, not asserted: the tag must still resolve to the
  # recorded commit, the test_cases corpus and limitations pages must hash to
  # the recorded git trees, and pydantic-monty must install with
  # --require-hashes and evaluate `1 + 1` through its own worker. Network-bound,
  # so it is its own job rather than a step of the source-only gate.
  upstream-pin:
    name: Upstream pin (pydantic/monty 1.1.0)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python3 -I tool/check_upstream_pin.py --online
      # Every upstream path:line the capability manifest cites must exist at
      # the pinned commit.
      - run: python3 -I tool/check_capability_manifest.py --online
      # Every file native/worker/ copies or follows, and upstream's Cargo.lock,
      # must still hash to its recorded sha256 at the pinned commit.
      - run: python3 -I tool/check_worker_mirror.py --online
      # Every tool/generate_*_oracle.py --check (glob): a stale committed
      # oracle .g.dart fails. One cached venv (Python 3.12, pydantic-monty from
      # the hash-pinned lock); ORACLE_REQUIRE makes a setup failure red.
      # The generators format their output with `dart format`, which needs the
      # resolved root package.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .venv-oracle
          key: oracle-venv-${{ runner.os }}-py312-${{ hashFiles('tool/upstream/requirements.lock') }}
      - name: Oracle files match upstream (--check, every generator)
        env:
          ORACLE_REQUIRE: '1'
        run: bash tool/check_oracles.sh

  # ---------------------------------------------------------------------------
  # Upstream parity: the measured baseline moves only on purpose
  # ---------------------------------------------------------------------------
  # Runs the parity suite (github.com/runyaga/dart_monty_parity, at the commit
  # PARITY_PIN names) against this checkout on the VM (FFI), dart2js and
  # dart2wasm, and asserts its tool/parity/baseline-current.json: every case's
  # result within every re-measured row, every row's status, the PRESENT
  # totals. On this x86_64 runner float_values is PARTIAL on vm and dart2wasm
  # (core's NaN sign bit), as recorded there; nothing else may differ.
  #
  # A change meant to move parity updates that baseline in dart_monty_parity
  # first, then bumps PARITY_PIN here in the same PR as the change.
  parity:
    name: Parity (pinned dart_monty_parity; vm, dart2js, dart2wasm)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The pin is one full commit SHA
        run: '[[ "$PARITY_PIN" =~ ^[0-9a-f]{40}$ ]] || { echo "PARITY_PIN must be a full commit SHA, got $PARITY_PIN"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: runyaga/dart_monty_parity
          ref: ${{ env.PARITY_PIN }}
          path: .parity
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          shared-key: native-amd64-v2
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-parity-${{ runner.os }}-${{ hashFiles('.parity/packages/monty_parity/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - name: The suite's upstream pins are this tree's
        run: python3 -I .parity/tool/check_core_upstream.py --core .
      # The traceback renderer's tests read the suite's display cases, baked
      # into test/unit/worker/_display_fixtures.g.dart; the baked file must be
      # the pinned commit's. (pub get: the generator formats with this
      # package's language version.)
      - name: The baked display fixtures are the pinned suite's
        run: |
          dart pub get
          python3 -I tool/generate_display_fixtures.py .parity --check
      - name: Run on the VM (FFI)
        run: python3 -I .parity/tool/parity/run.py vm --core . --out /tmp/parity
      - name: Run on dart2js
        run: python3 -I .parity/tool/parity/run.py dart2js --core . --out /tmp/parity
      - name: Run on dart2wasm
        run: python3 -I .parity/tool/parity/run.py dart2wasm --core . --out /tmp/parity
      - name: Score and assert the current baseline
        run: |
          python3 -I .parity/tool/parity/score.py /tmp/parity \
            --json /tmp/parity/score.json --markdown /tmp/parity/score.md \
            --assert-current .parity/tool/parity/baseline-current.json
      - name: Publish the scorecard
        if: success() || failure()
        run: '[ -f /tmp/parity/score.md ] && cat /tmp/parity/score.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() || failure()
        with:
          name: parity
          path: /tmp/parity
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The M2 gate: E0 through the worker, on vm, dart2js and dart2wasm
  # ---------------------------------------------------------------------------
  # The same pinned suite's `e0` cases (tool/parity/e0.json), run through the
  # monty-proto worker rather than the public API: the executable worker-rust
  # built on the VM, the committed lib/assets/dart_monty_core_proto_worker
  # .{js,wasm} in Chrome on dart2js and dart2wasm. Every counted case must
  # MATCH upstream on each backend (s07, complex, is deferred and reported,
  # not counted). Each run also runs the suite's worker crash tests on that
  # backend: deadline kill, native stack overflow, wasm trap under JSPI and
  # the forced fallback, each a typed MontyCrashedError and then a fresh
  # worker answering. The same runs carry the suite's worker value rows
  # (rows.json `worker`): every pre-cutover case must MATCH, each recorded
  # divergence must differ exactly as recorded, the cutover cases must run,
  # and each negative control must turn a match into a difference.
  parity-e0:
    name: Parity E0 through the worker (pinned dart_monty_parity; vm, dart2js, dart2wasm)
    needs: [changes, worker-rust]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The pin is one full commit SHA
        run: '[[ "$PARITY_PIN" =~ ^[0-9a-f]{40}$ ]] || { echo "PARITY_PIN must be a full commit SHA, got $PARITY_PIN"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: runyaga/dart_monty_parity
          ref: ${{ env.PARITY_PIN }}
          path: .parity
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      # `dart run` / `dart test` run hook/build.dart, which builds the
      # in-process native crate; restore the shared cache rather than build
      # it cold.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          shared-key: native-amd64-v2
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-parity-${{ runner.os }}-${{ hashFiles('.parity/packages/monty_parity/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Download the worker executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dart_monty_worker-linux-x64
          path: lib/src/bin/linux-x64
      # Where tool/build_worker.sh puts it and worker_locator.dart looks.
      # Artifacts do not keep the executable bit.
      - run: chmod +x lib/src/bin/linux-x64/dart_monty_worker
      - name: E0 on the VM (worker process) + crash tests
        run: python3 -I .parity/tool/parity/run.py vm --engine worker --core . --out /tmp/parity-e0
      - name: E0 on dart2js (Web Worker) + crash tests
        run: python3 -I .parity/tool/parity/run.py dart2js --engine worker --core . --out /tmp/parity-e0
      - name: E0 on dart2wasm (Web Worker) + crash tests
        run: python3 -I .parity/tool/parity/run.py dart2wasm --engine worker --core . --out /tmp/parity-e0
      - name: Assert E0 (every counted case MATCH on every backend)
        run: |
          python3 -I .parity/tool/parity/score.py /tmp/parity-e0 --assert-e0 \
            --json /tmp/parity-e0/e0.json --markdown /tmp/parity-e0/e0.md
      - name: Assert the worker value rows (every pre-cutover case MATCH on every backend)
        if: success() || failure()
        run: |
          python3 -I .parity/tool/parity/score.py /tmp/parity-e0 --assert-worker \
            --json /tmp/parity-e0/worker.json --markdown /tmp/parity-e0/worker.md
      # The same E0 cases through the internal pool session (C1-3a): one pool
      # per run, its one worker Reset and reused from case to case.
      - name: E0 through the session on the VM
        if: success() || failure()
        run: python3 -I .parity/tool/parity/run.py vm --engine session --core . --out /tmp/parity-e0
      - name: E0 through the session on dart2js
        if: success() || failure()
        run: python3 -I .parity/tool/parity/run.py dart2js --engine session --core . --out /tmp/parity-e0
      - name: E0 through the session on dart2wasm
        if: success() || failure()
        run: python3 -I .parity/tool/parity/run.py dart2wasm --engine session --core . --out /tmp/parity-e0
      - name: Assert E0 through the session (every counted case MATCH on every backend)
        if: success() || failure()
        run: |
          python3 -I .parity/tool/parity/score.py /tmp/parity-e0 --assert-e0 --engine session \
            --json /tmp/parity-e0/e0-session.json --markdown /tmp/parity-e0/e0-session.md
      # The suite's C1 gate (tool/parity/c1-gate.json), from the same session
      # runs: every case and probe of a landed row MATCH on every backend,
      # with no named exception, and every row's cases and probes run.
      - name: Assert the C1 gate through the session
        if: success() || failure()
        run: |
          python3 -I .parity/tool/parity/score.py /tmp/parity-e0 --assert-gate \
            --json /tmp/parity-e0/gate.json --markdown /tmp/parity-e0/gate.md
      - name: Publish the E0, worker and gate tables
        if: success() || failure()
        run: 'for f in /tmp/parity-e0/e0.md /tmp/parity-e0/worker.md /tmp/parity-e0/e0-session.md /tmp/parity-e0/gate.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done; true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() || failure()
        with:
          name: parity-e0
          path: /tmp/parity-e0
          retention-days: 14

  # ---------------------------------------------------------------------------
  # FFI binding generation
  # ---------------------------------------------------------------------------
  ffigen:
    name: Generate FFI bindings
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Generate bindings
        run: bash tool/generate_bindings.sh
      # A DRIFT CHECK, not a producer. The bindings are committed, and every
      # other job builds against the committed copy; this job proves that copy
      # is what ffigen emits from the current header. It used to upload the
      # regenerated file for four jobs to download over the committed one,
      # which serialised them behind this job and hid drift instead of failing.
      - name: Committed bindings match ffigen output
        run: |
          set -euo pipefail
          F=lib/src/ffi/generated/dart_monty_bindings.dart
          # Present AND tracked: a diff of an untracked or deleted file is empty.
          [ -s "$F" ] || { echo "FAIL: $F missing or empty after generation."; exit 1; }
          git ls-files --error-unmatch "$F" >/dev/null \
            || { echo "FAIL: $F is not tracked by git."; exit 1; }
          # Nothing else may appear under generated/ either.
          UNTRACKED="$(git ls-files --others --exclude-standard -- lib/src/ffi/generated/)"
          [ -z "$UNTRACKED" ] || { echo "FAIL: untracked generated files: $UNTRACKED"; exit 1; }
          git diff --exit-code -- lib/src/ffi/generated/ || {
            echo "FAIL: lib/src/ffi/generated/ is stale -- run bash tool/generate_bindings.sh and commit."
            exit 1
          }
          echo "OK: committed bindings match ffigen output"

  # ---------------------------------------------------------------------------
  # monty-proto Dart bindings: drift check
  # ---------------------------------------------------------------------------
  # Same shape as `ffigen` above. lib/src/worker/proto/ is committed protoc
  # output for upstream's monty.proto at the commit tool/upstream/upstream-pin.json
  # records, built with the hash-pinned protoc in
  # tool/upstream/protoc-requirements.lock, protoc_plugin 25.1.0 compiled from
  # the committed tool/proto_gen/pubspec.lock, and the pinned SDK's formatter.
  # This job regenerates it and fails on any difference.
  #
  # It is also the COMPENSATING CHECK for analysis_options.yaml excluding that
  # directory from the analyzer and DCM, and for the coverage tools excluding it
  # from the denominator: nothing lints or measures generated code, so this job
  # is what proves it is only generated code.
  proto-drift:
    name: monty-proto bindings drift
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      # A version the lock has wheel hashes for (CPython 3.12-3.14).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: proto-gen-${{ runner.os }}-${{ hashFiles('tool/proto_gen/pubspec.lock') }}
      - name: Generate bindings
        run: bash tool/generate_proto.sh
      - name: Committed bindings match protoc output
        run: |
          set -euo pipefail
          D=lib/src/worker/proto/
          # Present AND tracked: a diff of an untracked or deleted file is empty.
          TRACKED="$(git ls-files -- "$D" | wc -l)"
          [ "$TRACKED" -gt 0 ] || { echo "FAIL: nothing tracked under $D."; exit 1; }
          UNTRACKED="$(git ls-files --others --exclude-standard -- "$D")"
          [ -z "$UNTRACKED" ] || { echo "FAIL: untracked generated files: $UNTRACKED"; exit 1; }
          git diff --exit-code --stat -- "$D" || {
            echo "FAIL: $D is stale -- run bash tool/generate_proto.sh and commit."
            exit 1
          }
          echo "OK: $TRACKED committed files match protoc output"

  # ---------------------------------------------------------------------------
  # Dart: analyze + format + unit tests (JIT) + coverage
  # ---------------------------------------------------------------------------
  test:
    name: Dart test (JIT)
    # worker-rust: the worker executable, so an untagged unit test may start a
    # real pool (test/unit/worker/real_pool_vm_test.dart).
    needs: [changes, worker-rust]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      # `dart test` runs hook/build.dart, which runs `cargo build --release
      # --lib --target x86_64-unknown-linux-gnu`. Without a cache that was a
      # cold ~300s build in this job; the shared key restores what the other
      # native-amd64 jobs (test-ffi) already compiled.
      #
      # save-if: false -- RESTORE ONLY. The key is written once, by whichever
      # job finishes first. This job builds only the release cdylib; test-ffi
      # also builds the dev oracle, so it is the one that must write the key,
      # or test-ffi restores a cache with no dev deps and builds them cold.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          shared-key: native-amd64-v2
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      # The executable worker-rust built, where tool/build_worker.sh puts it
      # and worker_locator.dart looks (as in test-worker-vm). Artifacts do not
      # keep the executable bit.
      - name: Download the worker executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dart_monty_worker-linux-x64
          path: lib/src/bin/linux-x64
      - run: chmod +x lib/src/bin/linux-x64/dart_monty_worker
      # analyze, format and the source-only check_*.sh scripts that used to be
      # repeated here run in `gate`, which runs on every code OR docs change
      # (a superset of this job's trigger). This job is the tests.
      # ---------------------------------------------------------------------------
      # DCM IS DELIBERATELY NOT RUN HERE. Do not add it back.
      # ---------------------------------------------------------------------------
      # Every DCM check -- `dcm analyze` via tool/dcm_ratchet.sh,
      # `dcm calculate-metrics` via tool/metrics_ratchet.sh, and
      # tool/check_dcm_exclusions.sh -- runs LOCALLY ONLY. This workflow
      # previously installed DCM (CQLabs/setup-dcm), carried DCM_CI_KEY /
      # DCM_EMAIL, and ran three DCM steps; all of that is removed.
      #
      # AND THE LOCAL RUNNER IS tool/dcm_host_gate.sh, NOT tool/gate.sh.
      # This comment used to say "runs in tool/gate.sh ONLY", which stopped
      # being true: gate.sh's dcm_here() skips every DCM check inside the
      # container AND on a host whose tree is resolved elsewhere -- which is
      # this checkout's normal state. So the sentence named a command that,
      # in both ordinary environments, checks no DCM at all.
      #
      # DCM is commercial: running it here spends the licence on every push and
      # every PR, and needs the key present as a repository secret to do it.
      # The gate is the place that decision belongs.
      #
      # The consequence is stated rather than hidden, and it is WIDER than this
      # comment used to admit: a contributor who does not run
      # `bash tool/dcm_host_gate.sh` gets no DCM feedback at all -- INCLUDING
      # one who ran `bash tool/gate.sh` and read "GATE GREEN". Measured
      # 2026-09-17: six suites were pushed that way while dcm_host_gate.sh was
      # RED on them with 35 findings. gate.sh now names the skipped DCM checks
      # in its own verdict line so that reading cannot be made again.
      #
      # The ratchets' RATCHET_BASE_REF protection (which exists so a PR cannot
      # lower its own bar) is likewise only exercised locally. That is the
      # accepted trade.
      - name: Test (JIT, unit only)
        # The exit-79 tolerance is GONE. It said "no tests found is acceptable
        # until unit tests exist"; 457 of them exist, so all it could do now was
        # turn a runner that registered nothing into a green tick -- the
        # skip-but-green shape this repo has already paid for once (8dbdd59,
        # "646 of 1593 registered tests" asserting nothing). A floor on the test
        # count replaces it: raise the floor when the suite grows, never lower
        # it to make a run pass.
        #
        # RAISED 400 -> 700 on 2026-09-17. The 400 was set against the 457
        # tests that existed then; the suite is now 753, so the floor had 353
        # tests of slack — a third of the suite could have vanished silently
        # while this step stayed green. Every other floor in this file sits
        # within ~10% of its observed count. Following this comment's own
        # instruction, late.
        run: |
          set -o pipefail
          dart test --exclude-tags=ffi,wasm,integration,ladder,worker \
            --coverage=coverage 2>&1 | tee /tmp/unit-test.log
          bash tool/assert_test_count.sh /tmp/unit-test.log 700 unit
      - name: Test (web, unit only — dart2js + dart2wasm)
        # The SAME pure-Dart suite, on both web compilers. Not redundant with the
        # JIT step above: dart2js has a single number type, so `4.0 is int` is
        # true and integral doubles collapse to ints, while dart2wasm has real
        # doubles. A numeric defect can pass on the VM and be wrong — or the fix
        # for it unreachable — on the web. That is not hypothetical: a fix to
        # inputs_encoder compiled, analysed clean and passed on the VM while
        # doing nothing at all, because the arm it added was dead on dart2js,
        # the only backend with the bug. Until this step existed, test/unit/ ran
        # on NO web target in CI.
        #
        # `vm-only` is excluded because those files cannot COMPILE for the web
        # (0x7FFFFFFFFFFFFFFF is a dart2js compile error), and that failure
        # happens before any test runs, so a `skip:` cannot contain it.
        # A FLOOR, because this step had none. It runs the same pure-Dart
        # suite as the JIT step on two web compilers, and nothing asserted it
        # registered anything — a compile that produced an empty suite, or a
        # tag filter that stopped matching, would have exited 0. 1483 observed
        # locally across both compilers (gate-20260917T123744Z); floor set
        # under it so ordinary churn does not trip it.
        run: |
          set -o pipefail
          dart test \
            --exclude-tags=ffi,wasm,integration,ladder,example,vm-only,worker \
            -p chrome -c dart2js -c dart2wasm 2>&1 | tee /tmp/unit-web.log
          bash tool/assert_test_count.sh /tmp/unit-web.log 1400 "unit (web)"

      - name: Generate LCOV
        run: |
          # `dart test --coverage=coverage` writes coverage/test/**/*.json, NOT
          # coverage/*.json. The old glob never matched, so an EMPTY lcov was
          # written every run and the 70% patch-coverage gate short-circuited to
          # exit 0 -- it has never once been enforced (core#130).
          #
          # The `else` branch that wrote an EMPTY tracefile is gone with it. It
          # was the second half of the same defect: having detected that no
          # coverage existed, it manufactured a file that made every downstream
          # gate pass. "No data" is now a failure, which is what it always was.
          shopt -s globstar nullglob
          if ! compgen -G "coverage/**/*.json" > /dev/null 2>&1; then
            echo "FAIL: no coverage data under coverage/ after a 400+ test run."
            exit 1
          fi
          # `dart run`, not `dart pub global activate`: coverage is a declared
          # dev_dependency now, so this uses the pinned resolution instead of
          # whatever pub.dev serves today.
          dart run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
      - name: Honest coverage report (every lib/ file in the denominator)
        # Dart's collector reports only LOADED libraries, so a file no test
        # imports is ABSENT from lcov.info, not 0% -- 22 of lib/'s 68 files
        # were, and the reported 40.2% could be RAISED by deleting an import.
        # This rebuilds the denominator from every lib/**/*.dart and fails if a
        # file is unaccounted for. Expect the printed lib-wide number to be far
        # below the loaded-files one; that gap is the finding, not a break.
        run: bash tool/coverage_report.sh --out-dir coverage coverage/lcov.info
      # The Codecov upload MOVED to the `coverage-merge` job below. It sat here,
      # in a job that finishes before any FFI tracefile exists, so Codecov
      # published the unit-only number while the gate used the merged one --
      # two different figures for the same commit, which is the drift class
      # check_wire_version.sh and check_fixture_links.sh already exist for.
      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov-dart
          # lcov.info (raw, loaded files only), merged.info (exclusions applied,
          # real lines only — what diff-cover gets), honest.info (every lib/
          # file — what humans get) and anchor.info (the zero baseline, which is
          # what lets the merge job run with no Dart SDK).
          path: |
            coverage/lcov.info
            coverage/merged.info
            coverage/honest.info
            coverage/anchor.info
          # NOT the default `warn`. With `if: always()` and a failed step above,
          # this uploaded NOTHING and reported SUCCESS -- measured on run
          # 34828230428, where the step is green and no lcov-dart artifact
          # exists. A green upload of zero files is how a downstream job comes
          # to merge fewer tracefiles than it believes it has.
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Dart: build and run an AOT consumer with bundled native assets
  # ---------------------------------------------------------------------------
  test-aot:
    name: AOT consumer
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The self-relaunch consumer adds a fat-LTO build of native/worker's
    # cdylib, cold on a cache miss.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      # `dart build cli` runs the same hook build as `dart test` (release,
      # --lib, --locked, x86_64-unknown-linux-gnu), so it restores the same
      # shared key. Restore-only: test-ffi is the one writer (see `test`).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          shared-key: native-amd64-v2
          save-if: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      # Build CLI bundles the hook's native asset; the probe asserts its result.
      - name: Build an AOT consumer
        run: dart build cli --target tool/aot_probe.dart -o build/aot
      - name: Run the AOT consumer
        working-directory: build/aot/bundle
        run: ./bin/aot_probe
      # That consumer does not opt in to the worker library, so its build must
      # be exactly what it was before the opt-in existed: one cargo build (the
      # in-process crate) and one bundled library. native/worker/target is
      # absent in a fresh checkout until something builds there; the worker
      # cache is restored only after this check, below.
      - name: Without the opt-in, no worker library and no worker build
        run: |
          set -euo pipefail
          ls -1 build/aot/bundle/lib | tee /tmp/bundle-libs.txt
          [ "$(cat /tmp/bundle-libs.txt)" = libdart_monty_core_native.so ] ||
            { echo "FAIL: expected only libdart_monty_core_native.so"; exit 1; }
          [ ! -e native/worker/target/x86_64-unknown-linux-gnu ] ||
            { echo "FAIL: the hook built native/worker without the opt-in"; exit 1; }
      # The worker cdylib the opted-in consumer's hook builds (release, --lib,
      # --target x86_64-unknown-linux-gnu). No other job builds that
      # configuration, so this job is its one writer. Restored HERE, after the
      # check above, which a restored native/worker/target would defeat.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/worker
          key: worker-cdylib-${{ hashFiles('native/worker/Cargo.lock') }}
      - name: Build the self-relaunch consumer (opts in)
        working-directory: tool/aot_worker
        run: |
          dart pub get
          dart build cli -o build/aot
          ls -1 build/aot/bundle/lib
      - name: E0 s10 through SelfRelaunch
        working-directory: tool/aot_worker
        run: |
          set -euo pipefail
          ./build/aot/bundle/bin/aot_worker s10_external_call.json
          # No relaunched worker may outlive the app.
          if pgrep -f -- --dart-monty-core-worker; then
            echo "FAIL: a relaunched worker is still running"; exit 1
          fi
      # The hook with native/Cargo.toml absent and the opt-in set still
      # builds the worker library (the tree the old engine's removal leaves).
      # Run after the opted-in consumer above, which built the same cdylib
      # configuration into native/worker/target; the test links that crate.
      - name: Hook builds the worker without the old crate
        run: |
          set -o pipefail
          dart test test/hook -p vm --run-skipped --tags=integration \
            2>&1 | tee /tmp/hook-test.log
          bash tool/assert_test_count.sh /tmp/hook-test.log 2 hook

  # ---------------------------------------------------------------------------
  # GitHub Pages render gate — the deployed site must load in a real browser
  # ---------------------------------------------------------------------------
  # https://runyaga.github.io/dart_monty_core/ serves the web REPL against the
  # SAME committed lib/assets/ bundle consumers get, so this is the only check
  # that the published artefacts resolve and wire up in a browser. A green WASM
  # fixture corpus does not cover it: that drives a test harness, not the
  # deployed page.
  pages:
    name: Pages site renders
    needs: [changes]
    # code OR docs, and the `docs` half is NOT optional. tool/check_pages.sh:66
    # copies docs/index.html INTO the site it renders -- that file IS the
    # published Pages content. Gating this job on `code` alone meant a PR that
    # edited docs/index.html skipped the only check that the published page
    # still loads in a browser. Caught in review, not by a failure.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # 22, not 20: tool/pages_drive.mjs drives Chrome over CDP using the
          # GLOBAL WebSocket, stable from Node 22. On 20 this gate died with
          # `ReferenceError: WebSocket is not defined`, and it only surfaced
          # the first time CI ever ran the gate.
          node-version: '24'
      - run: dart pub get
      - name: Pages render gate
        run: bash tool/check_pages.sh

  # ---------------------------------------------------------------------------
  # Rust: fmt + clippy + tests + unioned llvm-cov coverage (≥77% line coverage)
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (fmt + clippy + test + coverage)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
      - name: cargo fmt
        working-directory: native
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: native
        # --all-targets MATTERS, and CI was missing it while tool/gate.sh had it.
        # Without it clippy lints the lib only: tests, benches, examples and
        # src/bin are never looked at. Proven 2026-09-14 by planting a
        # `needless_range_loop` in native/tests/integration.rs --
        # `cargo clippy -- -D warnings` PASSED, `--all-targets` reported 3
        # errors. Every lint this project added to tests was unenforced in CI.
        run: cargo clippy --all-targets -- -D warnings
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - name: cargo deny check
        working-directory: native
        run: cargo deny check
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage (≥77% line coverage)
        # NOT `cargo llvm-cov` directly. It merges by SYMBOL NAME, and lib.rs
        # holds 63 `#[unsafe(no_mangle)] pub extern "C"` functions whose symbols
        # therefore carry no hash disambiguator -- so the cfg(test) copy and the
        # integration copy of `monty_create` collide, llvm-cov keeps one mapping,
        # and the other binary's real hits are dropped. That reported lib.rs at
        # 2.23% while the integration suite alone proved 36.50%, and the project
        # total at 71.02% instead of 79.00%.
        #
        # tool/rust_coverage.sh runs each target into its own profile and unions
        # the LCOV by file:line, which cannot collide. It carries a guard that
        # refuses to print a total below any single target's own figure, so the
        # undercount cannot come back silently. Reverting this to a bare
        # `cargo llvm-cov` call reinstates the bug AND reads 71.02% against the
        # 74% floor below -- a false red, not a quiet pass.
        run: bash tool/rust_coverage.sh --summary --fail-under 77

  # ---------------------------------------------------------------------------
  # Worker crate: native/worker (upstream's `monty subprocess` loop)
  # ---------------------------------------------------------------------------
  # Its own cargo workspace and Cargo.lock, so its own cache, keyed on that lock.
  # One cargo call builds the executable and the cdylib (two fat-LTO links);
  # the smoke test runs against that same release executable. The wasm module
  # is not shipped yet; it is built and driven through its dmw_* exports.
  worker-rust:
    name: Worker crate (fmt + clippy + build + smoke)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/worker
          key: worker-${{ hashFiles('native/worker/Cargo.lock') }}
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy (native)
        run: cargo clippy --locked --all-targets -- -D warnings
      # src/wasm.rs compiles only for wasm32, so the native pass never sees it.
      - name: cargo clippy (wasm32-wasip1)
        run: cargo clippy --locked --lib --target wasm32-wasip1 -- -D warnings
      - name: Build executable + cdylib
        run: cargo build --locked --release --lib --bins
      - name: Smoke test (Configure, Feed 1 + 1, Shutdown)
        run: cargo test --locked --release
      - name: Build wasm module (mixd)
        run: cargo build --locked --profile mixd --lib --target wasm32-wasip1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      # Consecutive large replies under a bounded max_memory: a turn's reply
      # must not stay allocated, and charged, through the next turn.
      - name: Wasm turns (dmw_dispatch under max_memory)
        run: node ../../tool/test_worker_wasm.mjs target/wasm32-wasip1/mixd/dart_monty_worker.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dart_monty_worker-linux-x64
          path: native/worker/target/release/dart_monty_worker
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ProcessChannel: the fake-worker crash tests and the real-worker smoke
  # ---------------------------------------------------------------------------
  # The `worker` tag is skipped by default (dart_test.yaml), so this is the one
  # job that runs it. It tests the executable worker-rust built and uploaded,
  # not a second build: the tested binary is the shipped one. Its coverage is
  # merged in coverage-merge, since no other suite loads lib/src/worker/
  # process_channel.dart.
  test-worker-vm:
    name: Worker channel tests (VM)
    needs: [changes, worker-rust]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      # `dart test` runs hook/build.dart, which builds the in-process native
      # crate; restore what test-ffi cached rather than build it cold. Restore
      # only, for the reason given in the `test` job.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          shared-key: native-amd64-v2
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      - name: Download the worker executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dart_monty_worker-linux-x64
          path: lib/src/bin/linux-x64
      # Where tool/build_worker.sh puts it and worker_locator.dart looks.
      # Artifacts do not keep the executable bit.
      - run: chmod +x lib/src/bin/linux-x64/dart_monty_worker
      - name: Test (worker tag)
        # Floor under the 177 tests registered once the session's failure
        # gates joined (11 of them; 165 with the session-settings oracle
        # cases, 106 with the pool-session tests, 95 with the display cases,
        # 36 when this job was added). The path is
        # load-bearing: without it every suite in test/ loads, the wasm ones fail
        # to, and each skipped suite writes an empty hitmap.
        run: |
          set -o pipefail
          dart test test/integration/worker -p vm --tags=worker \
            --coverage=coverage-worker 2>&1 | tee /tmp/worker-test.log
          bash tool/assert_test_count.sh /tmp/worker-test.log 165 worker
      - name: Generate worker LCOV
        run: |
          shopt -s globstar nullglob
          if ! compgen -G "coverage-worker/**/*.json" > /dev/null 2>&1; then
            echo "FAIL: --coverage=coverage-worker produced no hitmap JSON."
            exit 1
          fi
          dart run coverage:format_coverage \
            --lcov --in=coverage-worker --out=coverage-worker/lcov.info \
            --report-on=lib
      - name: Upload worker lcov artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov-worker
          path: coverage-worker/lcov.info
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build WASM binary (wasm32-wasip1)
  # ---------------------------------------------------------------------------
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
      # Compile-only: the one CI build of the shipped wasm feature set (the same
      # command as tool/prebuild.sh). Tests run the COMMITTED lib/assets/ wasm,
      # so the binary is not uploaded -- no job ever downloaded it.
      - name: Build WASM
        working-directory: native
        run: cargo build --release --target wasm32-wasip1

  # ---------------------------------------------------------------------------
  # FFI integration tests — 464 fixtures, oracle binary vs MontyFfi
  # Runs on VM (JIT). The oracle subprocess itself is a Rust binary.
  # ---------------------------------------------------------------------------
  test-ffi:
    name: FFI integration tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # 20 + 5 for the example smoke suite folded in from test-examples, which
    # on a cold cache was the job that needed the most headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          # SHARED with the other native-amd64 release job. Swatinem defaults to
          # a per-job key (add-job-id-key: true) and cache-on-failure: false, so
          # a job that is red never saves and never warms. test-examples had
          # been red for 10 runs and its key had never existed, which is why it
          # spent 698s of a 736s job compiling what test-ffi built in 56s on a
          # hit. A shared key lets the job that passes populate the cache the
          # job that fails restores from.
          #
          # Scope is deliberate: build-wasm targets wasm32-wasip1 (different
          # triple) and test-hooks-corpus documents its own key for a different
          # feature set. Neither shares this one. The `rust` job is dev-profile
          # and is left alone so it cannot win the write-once race and leave the
          # release jobs cold.
          #
          # -v2: the v1 entry on main was written by the old test-examples job,
          # which built no dev oracle, so every hit here rebuilt the oracle's
          # dev deps cold (~70s), and an exact hit never re-saves. test-ffi is
          # now the only writer (the other jobs on this key are save-if: false).
          shared-key: native-amd64-v2
      - name: Build native library
        working-directory: native
        # --target MATCHES THE HOOK, and that is the whole point of the flag.
        # hook/build.dart:36-37 computes `_rustTriple(os, arch)` and passes
        # `--target <triple>`, so it builds into target/<triple>/release/. A bare
        # `cargo build --release` builds into target/release/ instead -- a
        # DIFFERENT directory that shares nothing. The result was the monty tree
        # compiled twice per job: once here, once by the hook, neither reusing
        # the other.
        #
        # `shared-key` (added in 5e25267) fixed the CACHE not warming between
        # jobs; it did nothing about this, because both directories were being
        # cached and both still had to be built. This is the other half.
        #
        # --lib and --locked MATCH THE HOOK TOO (hook/build.dart passes exactly
        # `build --locked --release --lib --target <triple>`). Without --lib
        # cargo also builds the release `oracle` bin, a second fat-LTO link
        # nothing runs: the tests use the dev-profile oracle built next.
        run: cargo build --locked --release --lib --target x86_64-unknown-linux-gnu
      - name: Build oracle binary
        working-directory: native
        run: cargo build --bin oracle
      - run: dart pub get
      - name: Run FFI integration tests
        # GLOB, not a hand-maintained list. The previous explicit list named 7
        # of the 19 ffi_*_test.dart files on disk, so twelve suites ran in no CI
        # job at all -- including ffi_open_test, mounts, snapshot/restore,
        # typeCheck, and ffi_monty_019_semantics_test, which was written for the
        # 0.19 upgrade itself (core#130). The local matrix always globbed, so
        # those suites passed locally and were simply never run in CI.
        #
        # ffi_with_cm_test.dart USED TO BE excluded here, on the grounds that
        # it needs `--features test-hooks`. That stopped being true upstream:
        # `_test_cm()` does not exist in monty v0.0.23 (`grep -rn "_test_cm"
        # crates/monty/src/` at rev 302e0f2 -> 0 hits) and the with__cm_*
        # fixtures use an ordinary Python `class CM:` now. Measured
        # 2026-09-13 on a NORMAL build, no test-hooks anything: 5/5 pass.
        # So five tests were excluded from CI for a requirement that no longer
        # exists, and tool/test_cm.sh -- the only thing that ran them -- is
        # referenced nowhere but comments. Glob them in.
        run: |
          FFI_TESTS=$(ls test/integration/ffi_*_test.dart)
          echo "Running $(echo "$FFI_TESTS" | wc -l | tr -d ' ') FFI suites:"
          echo "$FFI_TESTS" | sed 's/^/  /'
          set -o pipefail
          dart test \
            $FFI_TESTS \
            test/integration/oracle_ffi_test.dart \
            test/integration/oracle_ffi_ext_test.dart \
            test/integration/repros \
            -p vm --run-skipped --tags=ffi --exclude-tags=pending-futures \
            --coverage=coverage-ffi \
            --reporter=expanded 2>&1 | tee /tmp/ffi-test.log
          # skip-but-green: a runner that registers zero tests prints
          # "All tests passed!" and exits 0. This suite is the single largest
          # coverage input in the repo now, so a silent zero here would look
          # like a 22-point coverage regression with no failing test to explain
          # it. Raise the floor when the suite grows; never lower it.
          bash tool/assert_test_count.sh /tmp/ffi-test.log 1300 FFI
      - name: Generate FFI LCOV
        # 1,356 tests, ~12s, on a job that ALREADY built the native library and
        # ALREADY ran this exact command. They drive ffi_core_bindings,
        # native_bindings_ffi, monty_repl and ffi_repl_bindings -- which the
        # unit-only measurement reported at 0.0%, 0.3%, 3.1% and 1.7%. The work
        # was being done and the record thrown away.
        run: |
          shopt -s globstar nullglob
          if ! compgen -G "coverage-ffi/**/*.json" > /dev/null 2>&1; then
            echo "FAIL: --coverage=coverage-ffi produced no hitmap JSON."
            exit 1
          fi
          dart run coverage:format_coverage \
            --lcov --in=coverage-ffi --out=coverage-ffi/lcov.info \
            --report-on=lib
      - name: Upload FFI lcov artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov-ffi
          path: coverage-ffi/lcov.info
          if-no-files-found: error
          retention-days: 1
      # -----------------------------------------------------------------------
      # Example smoke tests — every example/*.dart must compile and exit 0.
      # `dart analyze` only checks types; this is the only thing exercising the
      # examples at runtime. Broken examples are tracked via markTestSkipped()
      # with a TODO reason; remove the skip-list entry to enforce.
      #
      # The repl_demo dart2js compile that used to follow is gone: the `pages`
      # job compiles repl_demo AND feature_matrix with dart2js and dart2wasm
      # (tool/check_pages.sh) on every code or docs change.
      # -----------------------------------------------------------------------
      # NOT measured for coverage, and the reason is worth recording because
      # the obvious assumption is wrong. This suite runs each example with
      # `Process.run('dart', ['run', ex])` (example_smoke_test.dart:59) -- a
      # separate PROCESS. `dart test --coverage` instruments the test isolate,
      # so the tracefile it produces here is EMPTY: measured, 11 passing tests,
      # one hitmap JSON, and `format_coverage --report-on=lib` writes 0 bytes.
      # Adding --coverage would buy nothing and would break the merge, which
      # treats an empty tracefile as a failure. Same structural cause as the
      # spawned-isolate case in native_isolate_bindings_impl.dart, one level
      # further out.
      - name: Run example smoke tests
        # Formerly its own job (`test-examples`), which rebuilt the same x86_64
        # release library this job has already built. Runs even if the FFI
        # suite failed, so one red result cannot hide the other.
        if: success() || failure()
        # Same BODY as tool/gate.sh runs, not the same four lines copied. This
        # step and gate.sh:274 had drifted: CI asserted a count, the local gate
        # asserted nothing, and the two picked different reporters. The floor is
        # no longer the hardcoded `14` either -- it was exactly met, 14 of 14, so
        # adding a 16th example would have left it at 14 and allowed one of the
        # existing fifteen to be deleted afterwards with CI still green.
        # tool/example_floor.sh derives it from the tree.
        run: bash tool/run_example_smoke.sh /tmp/example-test.log

  # ---------------------------------------------------------------------------
  # WASM/JS integration tests — 464 fixtures through MontyWasm in headless Chrome
  # Uses the dart_monty JS bridge (sparse-checkout) + freshly built WASM binary.
  # ---------------------------------------------------------------------------
  test-wasm:
    name: WASM/JS integration tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      # Assets are committed to git (Mode A). Stage them directly for
      # the test runner rather than rebuilding from source — drift-check
      # owns the rebuild-parity story. No npm install: the worker supplies
      # its own WASI imports (js/src/wasm_glue.js), so nothing from
      # js/node_modules is served.
      - name: Stage bridge assets for test runner
        run: |
          set -euo pipefail
          WEB_DIR="test/integration/web"

          # Verify committed assets exist (they should — drift-check enforces).
          for f in lib/assets/dart_monty_core_bridge.js lib/assets/dart_monty_core_worker.js lib/assets/dart_monty_core_native.wasm; do
            [ -f "$f" ] || { echo "FATAL: committed asset missing: $f (run bash tool/prebuild.sh)"; exit 1; }
          done

          # Stage bridge assets for the test runner.
          mkdir -p "$GITHUB_WORKSPACE/$WEB_DIR"
          cp lib/assets/dart_monty_core_bridge.js "$GITHUB_WORKSPACE/$WEB_DIR/"
          cp lib/assets/dart_monty_core_worker.js "$GITHUB_WORKSPACE/$WEB_DIR/"
          cp lib/assets/dart_monty_core_native.wasm "$GITHUB_WORKSPACE/$WEB_DIR/"

          # Final verification — every file the test runner needs must exist.
          for f in \
            "$WEB_DIR/dart_monty_core_bridge.js" \
            "$WEB_DIR/dart_monty_core_worker.js" \
            "$WEB_DIR/dart_monty_core_native.wasm"; do
            [ -f "$GITHUB_WORKSPACE/$f" ] || { echo "FATAL: staged asset missing: $f"; exit 1; }
          done

          echo "=== bridge assets staged ==="
          ls -lh "$GITHUB_WORKSPACE/$WEB_DIR/"

      - run: dart pub get

      # The two "Compile WASM runner to ..." steps that used to sit here are
      # gone: tool/test_wasm.sh compiles the runner itself on every invocation,
      # so they were redundant — and the dart2wasm one compiled with
      #     -o test/integration/web/wasm_runner.wasm
      # which is a TRACKED file. The script compiles into a mktemp dir
      # precisely to avoid that (tool/test_wasm.sh: "would overwrite three
      # tracked files"), so keeping the CI step defeated its own protection.
      - name: Corpus in headless Chrome (dart2js)
        run: bash tool/test_wasm.sh --skip-build

      - name: Corpus in headless Chrome (dart2wasm)
        # success() || failure(), NOT always(): the intent is only that a
        # dart2js failure must not hide the dart2wasm result. always() would
        # also fire after a CANCELLED workflow or a failed setup step, running
        # the corpus in a half-built tree and reporting confusing errors.
        if: success() || failure()
        run: bash tool/test_wasm.sh --skip-build --dart2wasm


  # ---------------------------------------------------------------------------
  # WASM unit-style tests — package:test scenarios under test/integration/wasm_*_test.dart
  # (datetime_oscall, multi_repl, setextfns, fixture). Distinct from the
  # fixture-corpus runner above, which uses a standalone Dart program.
  # ---------------------------------------------------------------------------
  test-wasm-unit:
    name: WASM unit-style tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      # `dart test` runs hook/build.dart, which runs `cargo build --release
      # --lib --target x86_64-unknown-linux-gnu`. Without a cache that was a
      # cold ~300s build in this job; the shared key restores what the other
      # native-amd64 jobs (test-ffi) already compiled.
      #
      # save-if: false -- RESTORE ONLY. The key is written once, by whichever
      # job finishes first. This job builds only the release cdylib; test-ffi
      # also builds the dev oracle, so it is the one that must write the key,
      # or test-ffi restores a cache with no dev deps and builds them cold.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          shared-key: native-amd64-v2
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - run: dart pub get

      - name: Run WASM unit-style tests (dart2js)
        # The floor is the point. tool/test_wasm_unit.sh checks that every
        # wasm_*_test.dart is LISTED, which catches a forgotten file -- it does
        # not check that any test RAN. `dart test` prints success and exits 0
        # on an empty run, so a staging failure that registered zero tests
        # reported green here. Measured on run 34869641865: this step really
        # runs `+751 ~85: All tests passed!`, and nothing asserted the 751.
        # Raise the floor when the suite grows; never lower it to make a run pass.
        run: |
          set -o pipefail
          bash tool/test_wasm_unit.sh 2>&1 | tee /tmp/wasm-unit-js.log
          bash tool/assert_test_count.sh /tmp/wasm-unit-js.log 700 "WASM unit (dart2js)"

      - name: Run WASM unit-style tests (dart2wasm)
        # Same suite, same WASM ENGINE, different DART compile target. Two things
        # are called "wasm" here: the Rust engine (driven by every test in this
        # suite whichever compiler is used) and the Dart target. Only this step
        # covers the second. CI already built dart2wasm for the fixture corpus
        # (job `test-wasm`), so the corpus had dart2wasm coverage while the
        # package:test suites did not.
        run: |
          set -o pipefail
          bash tool/test_wasm_unit.sh --dart2wasm 2>&1 | tee /tmp/wasm-unit-w.log
          bash tool/assert_test_count.sh /tmp/wasm-unit-w.log 700 "WASM unit (dart2wasm)"

  # ---------------------------------------------------------------------------
  # WorkerChannel in Chrome against the COMMITTED proto worker wasm
  # ---------------------------------------------------------------------------
  # lib/assets/dart_monty_core_proto_worker.{js,wasm} through WorkerChannel on
  # both Dart web compilers: two Workers sharing one compiled Module, a wasm
  # trap surfacing as MontyCrashedError with a working replacement, kill,
  # protocol skew, and `jspi == true` on Chrome plus the forced-fallback
  # variant. The wasm is not rebuilt here: tests run the asset consumers get,
  # and tool/check_asset_freshness.sh (gate job) ties it to native/worker/.
  test-worker-web:
    name: Worker channel (Chrome, dart2js + dart2wasm)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      # `dart test` runs hook/build.dart (the in-process crate) whatever the
      # platform; restore the shared native cache rather than build it cold.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          shared-key: native-amd64-v2
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      # One run per compiler, each with its own test-count floor, and
      # coverage from dart2js alone: tool/test_worker_web.sh says why.
      - name: Worker channel tests (dart2js, then dart2wasm)
        run: bash tool/test_worker_web.sh --coverage coverage-web
      # The only measurement of lib/src/worker/worker_channel.dart, which the
      # VM cannot load. coverage-merge takes it with --browser, for that file
      # alone (tool/coverage_report.sh says why).
      - name: Format Chrome coverage
        run: |
          dart run coverage:format_coverage --lcov --in=coverage-web \
            --out=coverage-web/lcov.info --report-on=lib --package=.
          test -s coverage-web/lcov.info
      - name: Upload Chrome tracefile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov-worker-web
          path: coverage-web/lcov.info
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # The upstream 1.1.0 corpus on the worker, and pool crash recovery
  # ---------------------------------------------------------------------------
  # Runs upstream's 643 `test_cases` through the pool session, one session per
  # fixture, judged by the strict adjudicator against each file's own
  # directives. Every file the worker fails is listed in the manifest
  # (packages/monty_conformance/lib/src/worker_corpus_manifest.dart) with a
  # divergence ID, and a run fails on any difference from the list in either
  # direction. Not a required check until the cutover; the old corpus jobs
  # (test-wasm, test-ffi, test-hooks-corpus) keep running meanwhile.
  #
  # Native on Linux here, on every PR; macOS arm64 in worker-nightly.yaml.
  # The browsers are the matrix job below.
  corpus-worker:
    name: Upstream corpus (worker, native Linux)
    needs: [changes, worker-rust]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      # `dart test` runs hook/build.dart, which builds the in-process native
      # crate; restore what test-ffi cached rather than build it cold. Restore
      # only, for the reason given in the `test` job.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          shared-key: native-amd64-v2
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      # The embedded corpus is upstream's, at the pinned commit: fetch that
      # commit read-only and regenerate. The generator refuses a checkout whose
      # commit or `crates/monty/test_cases` git tree is not the pin's, and
      # --check fails on any difference from the committed file.
      - name: The embedded corpus is the pinned upstream corpus
        run: |
          set -euo pipefail
          commit="$(python3 -I -c "import json;print(json.load(open('tool/upstream/upstream-pin.json'))['commit'])")"
          up="$(mktemp -d)"
          git init -q "$up"
          git -C "$up" fetch -q --depth 1 https://github.com/pydantic/monty "$commit"
          git -C "$up" checkout -q FETCH_HEAD
          dart tool/generate_fixture_corpus_v1.dart "$up" --check
      - name: Download the worker executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dart_monty_worker-linux-x64
          path: lib/src/bin/linux-x64
      # Where tool/build_worker.sh puts it and worker_locator.dart looks.
      # Artifacts do not keep the executable bit.
      - run: chmod +x lib/src/bin/linux-x64/dart_monty_worker
      - name: Corpus and crash recovery (native)
        run: bash tool/test_corpus_worker.sh native

  corpus-worker-web:
    name: Upstream corpus (worker, ${{ matrix.browser }} ${{ matrix.compiler }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        compiler: [dart2js, dart2wasm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      # `dart test` runs hook/build.dart (the in-process crate) whatever the
      # platform; restore the shared native cache rather than build it cold.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          shared-key: native-amd64-v2
          save-if: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - run: dart pub get
      # The version of the browser this leg judges, in the log beside the
      # test's own JSPI probe line.
      - name: Browser version
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$BROWSER" = chrome ]; then google-chrome --version; else firefox --version; fi
      - name: Corpus and crash recovery (${{ matrix.browser }}, ${{ matrix.compiler }})
        env:
          BROWSER: ${{ matrix.browser }}
          COMPILER: ${{ matrix.compiler }}
        run: bash tool/test_corpus_worker.sh "$BROWSER" "$COMPILER"

  # ---------------------------------------------------------------------------
  # test-hooks corpus — the eight fixtures that call sys.setrecursionlimit
  #
  # These need an engine built `--features test-hooks`, which is NEVER shipped
  # (native/Cargo.toml:36-38). Without it the corpus skips them; with it they
  # run. Measured 2026-09-13 on the 590-fixture v0.0.23 corpus, identical on
  # amd64 and arm64 and on both compile targets:
  #   shipped engine   575 passed / 3 failed / 12 skipped
  #   test-hooks       585 passed / 1 failed /  4 skipped
  # The ten extra passes are the eight setrecursionlimit fixtures plus
  # functools__gc.py and itertools__gc.py, which need the gc module test-hooks
  # enables. Until this job existed CI ran NEITHER variant, so
  # those eight were verified only by whoever happened to run tool/gate.sh
  # locally — and on dart2wasm they had never executed anywhere at all.
  #
  # Cost is a ~3 min cargo build for the test-hooks engine, shared by both
  # steps. That is why this is its own job rather than steps bolted onto
  # test-wasm: a feature-flag rebuild would evict test-wasm's cache and make
  # every other WASM job pay for it.
  # ---------------------------------------------------------------------------
  test-hooks-corpus:
    name: test-hooks corpus (dart2js + dart2wasm)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native
          # Its own cache key. The test-hooks build is a DIFFERENT feature set
          # and lands in its own CARGO_TARGET_DIR; sharing a key with the
          # release jobs would thrash both.
          key: test-hooks
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - run: dart pub get

      # Both steps PIN THE RESULT rather than trusting the exit code.
      # tool/test_cm_wasm.sh does `exit 0` when it cannot find Chrome —
      # "WARN: Chrome not found" and a green job that ran nothing. ubuntu-latest
      # ships Chrome today, but a runner image change would turn this job into a
      # rubber stamp silently, which is the exact failure mode these eight
      # fixtures already spent months in. So the pin stays; what it pins changed.
      #
      # It used to grep for `{"total":531,"passed":528,"failed":0`. That was the
      # v0.0.19 corpus. The corpus is 590 now, so the string became unreachable
      # and this job could not go green no matter what the code did — measured
      # 2026-09-13, both backends and both architectures:
      #   {"total":590,"passed":585,"failed":1,"skipped":4}
      # the single failure being dataclass__basic.py, which has failed since
      # a0dd284 and is declared in tool/cm-corpus-expected-failures.txt.
      #
      # Pinning a pass COUNT was the mistake: it has to be hand-edited every
      # time upstream adds a fixture, and when it drifts it fails in the
      # direction that looks like a code regression. Pin the corpus SIZE to the
      # provenance file instead — that is the part a rubber-stamp run cannot
      # fake — and let the script's declared expected-failure set judge which
      # fixtures may fail.
      - name: test-hooks corpus (dart2js)
        run: |
          set -euo pipefail
          bash tool/test_cm_wasm.sh 2>&1 | tee /tmp/cm_js.log
          want=$(python3 -c "import json;print(json.load(open('tool/fixture-corpus.json'))['fixture_count'])")
          grep -q "FIXTURE_DONE:{\"total\":$want," /tmp/cm_js.log \
            || { echo "FAIL: dart2js test-hooks corpus did not report $want fixtures."; \
                 grep -o 'FIXTURE_DONE:{[^}]*}' /tmp/cm_js.log || echo "  (no FIXTURE_DONE at all — did it run?)"; \
                 exit 1; }

      - name: test-hooks corpus (dart2wasm)
        # The compile target, not the engine — both steps drive the same
        # test-hooks WASM engine. This is the only place the dart2wasm twin of
        # the corpus runner is exercised with test-hooks on.
        run: |
          set -euo pipefail
          bash tool/test_cm_wasm.sh --dart2wasm 2>&1 | tee /tmp/cm_w.log
          want=$(python3 -c "import json;print(json.load(open('tool/fixture-corpus.json'))['fixture_count'])")
          grep -q "FIXTURE_DONE:{\"total\":$want," /tmp/cm_w.log \
            || { echo "FAIL: dart2wasm test-hooks corpus did not report $want fixtures."; \
                 grep -o 'FIXTURE_DONE:{[^}]*}' /tmp/cm_w.log || echo "  (no FIXTURE_DONE at all — did it run?)"; \
                 exit 1; }

      - name: The tree must be unchanged
        # test_cm_wasm.sh stages into temp dirs and builds into its own
        # CARGO_TARGET_DIR precisely so it cannot leave a test-hooks engine
        # where lib/assets/ is staged from. Assert that, rather than trust it.
        #
        # No path is excluded. js/package-lock.json used to be, because this
        # job ran `npm install --force` for the WASI shim and npm rewrote the
        # lockfile; the job no longer runs npm at all.
        run: |
          set -euo pipefail
          DIRTY="$(git status --porcelain -- .)"
          if [ -n "$DIRTY" ]; then
            echo "FAIL: the test-hooks corpus modified the working tree:"
            echo "$DIRTY"
            exit 1
          fi
          echo "OK: tree clean"

  # ---------------------------------------------------------------------------
  # Coverage: merge every measured suite, report lib-wide, ratchet
  # ---------------------------------------------------------------------------
  # Two suites produce a usable tracefile and both measure the SAME lib/. Until
  # this job existed only the first was counted, so the published figure
  # described 457 unit tests and silently discarded the 1,356-test FFI
  # conformance suite that runs in this same workflow, in 12 seconds, over
  # exactly the files the published figure reported at 0-3%.
  #
  # The example suite is deliberately NOT here -- see the note on it above: it
  # runs each example in a separate process, so its tracefile is empty.
  #
  # No Dart SDK here on purpose: the zero baseline (coverage/anchor.info) is
  # produced once in the `test` job, travels with the artifact, and is passed
  # back in with --baseline. This job is checkout + python3.
  coverage-merge:
    name: Coverage (merged, lib-wide) + ratchet
    needs: [changes, test, test-ffi, test-worker-web, test-worker-vm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A push is compared with its first parent (tool/ci_ratchet_base.sh).
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # R5: each download FAILS if its artifact is absent, and
      # tool/coverage_report.sh FAILS on an empty input. Silently merging fewer
      # inputs and reporting a smaller number is the shape core#130 already cost
      # this repo -- "an EMPTY lcov was written every run and the gate
      # short-circuited to exit 0".
      - name: Download unit tracefile + zero baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov-dart
          path: coverage
      - name: Download FFI tracefile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov-ffi
          path: coverage-ffi
      - name: Download Chrome tracefile (worker channel)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov-worker-web
          path: coverage-web
      - name: Download worker tracefile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov-worker
          path: coverage-worker
      - name: Merge and report
        # R3: `lcov -a` needs identical absolute paths in every input. Every job
        # here runs in /home/runner/work/dart_monty_core/dart_monty_core, and
        # the merge resolves each SF against the repo root, so a tracefile from
        # somewhere else lands in the "covers files that do not exist under
        # lib/" branch and fails loudly rather than duplicating every file.
        run: |
          bash tool/coverage_report.sh \
            --baseline coverage/anchor.info \
            --out-dir coverage \
            --browser coverage-web/lcov.info \
            coverage/lcov.info \
            coverage-ffi/lcov.info \
            coverage-worker/lcov.info
      - name: Coverage ratchet (no per-file decrease)
        # The floor under the merge. Without it the reclassification is a
        # one-off: new native code lands, the FFI conformance corpus does not
        # grow to match, and per-file coverage slides back invisibly because the
        # project total is dominated by files nobody is changing. Same shape and
        # same discipline as tool/dcm_ratchet.sh.
        #
        # RATCHET_BASE_REF is what stops a PR lowering its own bar. Without it
        # the ratchet reads the baseline from the PR's own working copy, so
        # `--update` plus a lowered baseline committed next to the regression it
        # excuses passes green -- reproduced 2026-09-14: a 228-hit regression in
        # monty_repl.dart with a matching baseline edit returned "PASS -- no file
        # below its baseline", exit 0. With the base ref set, the same pair fails
        # naming both the FILE and TOTAL decrease. On a push (and a dispatch) the
        # base is the commit's first parent: with none, every file the merge
        # deleted read as VANISHED, the run failed before `lcov-merged` was
        # uploaded, and the after-merge baseline recording could not happen.
        # tool/ci_ratchet_base.sh picks the ref, and fails rather than return
        # an empty one.
        run: |
          RATCHET_BASE_REF="$(bash tool/ci_ratchet_base.sh)"
          export RATCHET_BASE_REF
          bash tool/coverage_ratchet.sh coverage/honest.info
      - name: Upload merged coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lcov-merged
          path: |
            coverage/merged.info
            coverage/honest.info
          if-no-files-found: error
          retention-days: 1
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/honest.info

  # ---------------------------------------------------------------------------
  # Patch coverage gate — PRs must maintain >= 30% coverage on changed lines
  # ---------------------------------------------------------------------------
  patch-coverage:
    name: Patch coverage gate (30%)
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, coverage-merge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install diff-cover
        run: pip install diff-cover
      - name: Download merged tracefile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lcov-merged
          path: coverage
      - name: Check patch coverage
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          # The "tracefile is empty -> exit 0" escape hatch is GONE. It was
          # core#130's other half: having found no coverage, it declared the
          # gate passed. coverage_report.sh now fails before this job starts if
          # any input is empty, so an empty file here means something is wrong,
          # not that there is nothing to check.
          if [ ! -s coverage/merged.info ]; then
            echo "FAIL: merged.info is empty — the merge job produced nothing."
            exit 1
          fi
          # merged.info already has the documented exclusions applied
          # (ffi/generated, worker/proto, mock_monty_platform), so only ONE
          # removal is left.
          # `*/native_bindings_ffi.dart` is GONE from this list: it was excluded
          # because it read 0.3%, and it now reads 76.8% because the FFI suite
          # that always covered it is finally measured. Excluding a covered file
          # only hides good news.
          #
          # native_isolate_bindings_impl.dart stays out, and not because it is
          # red: it runs in a SPAWNED isolate and package:test collects with
          # `isolateIds: {isolateId!}` (test_core .../vm/platform.dart), so no
          # test that could ever be written for it would move this number.
          # Charging a patch for lines the toolchain cannot observe is noise.
          #
          # --ignore-errors unused: the exclusion is DEFENSIVE and must not be
          # fatal when the pattern matches nothing -- exactly how this gate died
          # the first time it ever ran.
          lcov --ignore-errors unused --remove coverage/merged.info \
            '*/native_isolate_bindings_impl.dart' \
            -o filtered-coverage.info
          diff-cover filtered-coverage.info \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=30 \
            --diff-range-notation='..'
