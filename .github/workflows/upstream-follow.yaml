name: Upstream follow

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      accept:
        description: 'Reviewed pending commit SHA to accept'
        required: false
        type: string
      max_commits:
        description: 'Maximum pending commits to test'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-follow
  cancel-in-progress: false

env:
  STATE_BRANCH: ${{ github.ref == 'refs/heads/main' && 'upstream-follow-state' || 'upstream-follow-state-test' }}

jobs:
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the parity pin
        run: |
          parity_pin=$(grep -E '^  PARITY_PIN: [0-9a-f]{40}$' .github/workflows/ci.yaml | awk '{print $2}')
          [[ "$parity_pin" =~ ^[0-9a-f]{40}$ ]] || { echo 'PARITY_PIN must be a full commit SHA'; exit 1; }
          echo "PARITY_PIN=$parity_pin" >> "$GITHUB_ENV"
      - name: Read the state branch
        run: |
          state_dir="$RUNNER_TEMP/upstream-state"
          echo "STATE_DIR=$state_dir" >> "$GITHUB_ENV"
          rc=0
          git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}" "$STATE_BRANCH" >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git clone --branch "$STATE_BRANCH" --depth 1 "https://github.com/${GITHUB_REPOSITORY}" "$state_dir"
          elif [ "$rc" = 2 ]; then
            mkdir "$state_dir"
          else
            echo "::error::cannot list the remote branches"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: runyaga/dart_monty_parity
          ref: ${{ env.PARITY_PIN }}
          path: .parity
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/upstream-follow/targets
          key: upstream-follow-targets-${{ github.run_id }}
          restore-keys: upstream-follow-targets-
      - run: dart pub get
      - name: Follow monty main
        env:
          ACCEPT: ${{ inputs.accept }}
          MAX_COMMITS: ${{ inputs.max_commits || '10' }}
        run: |
          args=(run --core "$GITHUB_WORKSPACE" --workdir "$RUNNER_TEMP/upstream-follow" \
            --parity "$GITHUB_WORKSPACE/.parity" --max-commits "$MAX_COMMITS" \
            --state-file "$STATE_DIR/last_good.json" --out result.json)
          if [ -n "$ACCEPT" ]; then args+=("--accept=$ACCEPT"); fi
          python3 -I tool/follow_upstream.py "${args[@]}"
      - name: Collect follow result
        if: always()
        run: |
          artifact_dir="$RUNNER_TEMP/follow-result"
          mkdir "$artifact_dir"
          [ ! -f result.json ] || cp result.json "$artifact_dir/result.json"
          [ ! -f "$STATE_DIR/last_good.json" ] || cp "$STATE_DIR/last_good.json" "$artifact_dir/last_good.json"
          [ ! -f "$STATE_DIR/evidence.jsonl" ] || cp "$STATE_DIR/evidence.jsonl" "$artifact_dir/evidence.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: follow-result
          path: ${{ runner.temp }}/follow-result

  publish:
    needs: follow
    if: always() && needs.follow.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        id: download
        continue-on-error: true
        with:
          name: follow-result
          path: follow-result
      - name: Advance the state branch
        if: steps.download.outcome == 'success' && hashFiles('follow-result/result.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state_dir="$RUNNER_TEMP/upstream-state"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          rc=0
          git ls-remote --exit-code --heads "$url" "$STATE_BRANCH" >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git clone --branch "$STATE_BRANCH" --depth 1 "$url" "$state_dir"
          elif [ "$rc" = 2 ]; then
            mkdir "$state_dir"
            git -C "$state_dir" init -q
            git -C "$state_dir" checkout -q --orphan "$STATE_BRANCH"
            git -C "$state_dir" remote add origin "$url"
          else
            echo "::error::cannot list the remote branches"
            exit 1
          fi
          for file in last_good.json evidence.jsonl; do
            [ ! -f "follow-result/$file" ] || cp "follow-result/$file" "$state_dir/$file"
          done
          git -C "$state_dir" config user.name "$GITHUB_ACTOR"
          git -C "$state_dir" config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git -C "$state_dir" add -A
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m 'chore: advance upstream follow state'
            git -C "$state_dir" push origin "HEAD:$STATE_BRANCH"
          fi
      - name: Weekly digest of flagged commits
        if: steps.download.outcome == 'success' && hashFiles('follow-result/result.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=follow-result/result.json
          count=$(python3 -I -c 'import json,sys; print(len(json.load(open(sys.argv[1])).get("flagged", [])))' "$result")
          if [ "$count" = 0 ]; then exit 0; fi
          digest="$RUNNER_TEMP/digest.md"
          existing="$RUNNER_TEMP/digest-existing.md"
          python3 -I tool/follow_upstream.py digest --result "$result" --out "$digest" >/dev/null
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            cat "$digest" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          marker=$(head -1 "$digest")
          issue=$(gh issue list --search 'Upstream follow: weekly digest in:title' --state open --json number --jq '.[0].number')
          if [ -z "$issue" ]; then
            issue=$(gh issue create --title 'Upstream follow: weekly digest' --body 'One comment per week lists the upstream commits the follow job advanced past with a flag.' | grep -oE '[0-9]+$')
          fi
          comment=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -1)
          if [ -n "$comment" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}" --jq .body > "$existing"
            python3 -I tool/follow_upstream.py digest --result "$result" --existing "$existing" --out "$digest" >/dev/null
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment}" -F "body=@${digest}"
          else
            gh issue comment "$issue" --body-file "$digest"
          fi
      - name: Report upstream drift
        if: steps.download.outcome == 'success' && hashFiles('follow-result/result.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_FILE: follow-result/result.json
          ISSUE_BODY: ${{ runner.temp }}/upstream-follow-issue.md
        run: |
          status=$(python3 -I -c 'import json,os; print(json.load(open(os.environ["RESULT_FILE"]))["status"])')
          case "$status" in red|error) ;; *) exit 0 ;; esac
          python3 -I - <<'PY' > "$ISSUE_BODY"
          import json
          import os

          result = json.load(open(os.environ['RESULT_FILE']))
          print('Upstream follow needs review.')
          print()
          print(f"Status: `{result['status']}`")
          if result['status'] == 'error':
              print(f"Error: {result['error']}")
          else:
              entry = result.get('commits', [])[-1] if result.get('commits') else {}
              pending = result.get('pending') or {}
              sha = entry.get('sha', pending.get('sha', 'unknown'))
              print(f"Commit: `{sha}`")
              print(f"Subject: {entry.get('subject', 'unknown')}")
              print(f"Stage: `{entry.get('stage', 'unknown')}`")
              print(f"Flags: {', '.join(entry.get('flags', [])) or 'none'}")
              print(f"New failures: {', '.join(result.get('new', [])) or 'none'}")
              print(f"Introduced by: `{sha}`")
          if result.get('not_baselined'):
              print(f"Not baselined: {', '.join(result['not_baselined'])}")
          PY
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            cat "$ISSUE_BODY" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing=$(gh issue list --search 'Upstream follow: needs attention in:title' --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$ISSUE_BODY"
          else
            gh issue create --title 'Upstream follow: needs attention' --body-file "$ISSUE_BODY"
          fi
