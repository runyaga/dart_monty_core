name: Upstream monty check

on:
  schedule:
    - cron: '0 8 * * 1'   # Weekly on Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for new monty releases
        id: check
        run: |
          # Latest release tag on pydantic/monty
          LATEST_TAG=$(gh api repos/pydantic/monty/releases/latest --jq '.tag_name' 2>/dev/null || echo "unknown")
          LATEST_VERSION="${LATEST_TAG#v}"

          # Current version pinned in Cargo.toml as tag = "vX.Y.Z"
          #
          # `| head -1` IS LOad-BEARING. native/Cargo.toml declares the tag on
          # THREE dependencies (monty, monty-type-checking, and one more), so the
          # bare grep returns three lines and CURRENT_TAG became a multi-line
          # value. Writing that to $GITHUB_OUTPUT emitted
          #     current_tag=v0.0.18
          #     v0.0.18            <- a bare line, not key=value
          # and Actions refused the whole file:
          #     ##[error]Unable to process file command 'output' successfully.
          #     ##[error]Invalid format 'v0.0.18'
          # That is why this scheduled job has failed every run.
          CURRENT_TAG=$(grep -oP 'tag = "\K[^"]*' native/Cargo.toml | head -1 || echo "unknown")
          CURRENT_VERSION="${CURRENT_TAG#v}"

          # Refuse to write a multi-line value rather than corrupt the whole
          # output file. A malformed $GITHUB_OUTPUT does not fail the step that
          # wrote it -- it fails the RUNNER's post-processing, which is why the
          # error above names no step and is easy to misread as infrastructure.
          for pair in "latest_tag=$LATEST_TAG" "latest_version=$LATEST_VERSION" \
                      "current_tag=$CURRENT_TAG" "current_version=$CURRENT_VERSION"; do
            if [ "$(printf '%s' "$pair" | wc -l | tr -d ' ')" != "0" ]; then
              echo "::error::refusing to write a multi-line value to GITHUB_OUTPUT: ${pair%%=*}" >&2
              exit 1
            fi
            echo "$pair" >> "$GITHUB_OUTPUT"
          done

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ] && \
             [ "$LATEST_VERSION" != "unknown" ] && \
             [ "$CURRENT_VERSION" != "unknown" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New monty release: $LATEST_TAG (current: $CURRENT_TAG)"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::monty is up to date ($CURRENT_TAG)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue for new monty release
        if: steps.check.outputs.changed == 'true'
        run: |
          # Avoid duplicate issues
          EXISTING=$(gh issue list \
            --search "monty ${{ steps.check.outputs.latest_tag }} in:title" \
            --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already exists, skipping."
            exit 0
          fi

          gh issue create \
            --title "chore(native): new upstream monty release ${{ steps.check.outputs.latest_tag }}" \
            --label "chore" \
            --body "$(cat <<BODY
          A new upstream monty release has been detected.

          | | Version |
          |---|---|
          | **Latest** | ${{ steps.check.outputs.latest_tag }} |
          | **Current** | ${{ steps.check.outputs.current_tag }} |

          **Release notes:** https://github.com/pydantic/monty/releases/tag/${{ steps.check.outputs.latest_tag }}

          ### Upgrade steps
          1. Update \`native/Cargo.toml\`: change \`tag = "${{ steps.check.outputs.current_tag }}"\` → \`tag = "${{ steps.check.outputs.latest_tag }}"\`
          2. \`cd native && cargo update\`
          3. Rebuild native library and oracle binary
          4. Run FFI integration tests: \`dart test test/integration/oracle_ffi_test.dart -p vm --run-skipped --tags=ffi\`
          5. Check for new \`MontyObject\` variants in \`convert.rs\`
          6. Un-xfail any fixtures that now pass
          7. Regenerate fixture corpus if test_cases changed: \`dart tool/generate_fixture_corpus.dart\`
          BODY
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
