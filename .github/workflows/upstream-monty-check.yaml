name: Upstream monty check

on:
  schedule:
    - cron: '0 8 * * 1'   # Weekly on Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    # `gh issue list/create` (GH_TOKEN) opens the upgrade issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for new monty releases
        id: check
        run: |
          # Latest release tag on pydantic/monty
          LATEST_TAG=$(gh api repos/pydantic/monty/releases/latest --jq '.tag_name' 2>/dev/null || echo "unknown")
          LATEST_VERSION="${LATEST_TAG#v}"

          # Current pin: tool/upstream/upstream-pin.json's `tag`. It must be a
          # single line: a multi-line value in $GITHUB_OUTPUT (the old grep of
          # the 0.0.x crate's manifest returned three) makes Actions refuse the
          # whole file, which is why the loop below checks each value.
          CURRENT_TAG=$(python3 -c "import json;print(json.load(open('tool/upstream/upstream-pin.json'))['tag'])" || echo "unknown")
          CURRENT_VERSION="${CURRENT_TAG#v}"

          # Refuse to write a multi-line value rather than corrupt the whole
          # output file. A malformed $GITHUB_OUTPUT does not fail the step that
          # wrote it -- it fails the RUNNER's post-processing, which is why the
          # error above names no step and is easy to misread as infrastructure.
          for pair in "latest_tag=$LATEST_TAG" "latest_version=$LATEST_VERSION" \
                      "current_tag=$CURRENT_TAG" "current_version=$CURRENT_VERSION"; do
            if [ "$(printf '%s' "$pair" | wc -l | tr -d ' ')" != "0" ]; then
              echo "::error::refusing to write a multi-line value to GITHUB_OUTPUT: ${pair%%=*}" >&2
              exit 1
            fi
            echo "$pair" >> "$GITHUB_OUTPUT"
          done

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ] && \
             [ "$LATEST_VERSION" != "unknown" ] && \
             [ "$CURRENT_VERSION" != "unknown" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New monty release: $LATEST_TAG (current: $CURRENT_TAG)"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::monty is up to date ($CURRENT_TAG)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue for new monty release
        if: steps.check.outputs.changed == 'true'
        run: |
          # Avoid duplicate issues
          EXISTING=$(gh issue list \
            --search "monty ${{ steps.check.outputs.latest_tag }} in:title" \
            --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already exists, skipping."
            exit 0
          fi

          gh issue create \
            --title "chore(worker): new upstream monty release ${{ steps.check.outputs.latest_tag }}" \
            --label "chore" \
            --body "$(cat <<BODY
          A new upstream monty release has been detected.

          | | Version |
          |---|---|
          | **Latest** | ${{ steps.check.outputs.latest_tag }} |
          | **Current** | ${{ steps.check.outputs.current_tag }} |

          **Release notes:** https://github.com/pydantic/monty/releases/tag/${{ steps.check.outputs.latest_tag }}

          ### Upgrade steps
          1. Update \`tool/upstream/upstream-pin.json\` (\`version\`, \`tag\`, \`commit\`, tree hashes) from ${{ steps.check.outputs.current_tag }} to ${{ steps.check.outputs.latest_tag }}
          2. Re-mirror the worker crate (\`native/worker/\`, \`tool/upstream/worker-mirror.json\`) and run \`cd native/worker && cargo update\`
          3. Map the package version per G9 (\`bash tool/check_version_pin.sh\`) in \`pubspec.yaml\` and \`native/worker/Cargo.toml\`
          4. Rebuild the worker and its wasm: \`bash tool/build_worker.sh\`, \`bash tool/prebuild.sh\`
          5. Regenerate the proto bindings (\`bash tool/generate_proto.sh\`) and the pinned corpus if test_cases changed
          BODY
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
