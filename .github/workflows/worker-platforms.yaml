name: Worker platforms

on:
  schedule:
    - cron: '10 4 * * *' # daily 04:10 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/worker-platforms.yaml'
      - 'tool/consumers/native/**'
      - 'tool/aot_worker/**'
      - 'tool/build_worker.sh'
      - 'native/worker/**'
      - 'lib/src/worker/**'
      - 'hook/**'

permissions:
  contents: read

jobs:
  worker-platform:
    name: Worker platform (${{ matrix.key }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: macos-arm64
            runner: macos-15
          - key: linux-x64
            runner: ubuntu-24.04
          - key: linux-arm64
            runner: ubuntu-24.04-arm
          - key: windows-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/worker
          key: worker-platform-${{ matrix.key }}-${{ hashFiles('native/worker/Cargo.lock') }}
      - run: dart pub get
      - name: Build package-relative worker
        shell: bash
        run: bash tool/build_worker.sh
      - name: Run native consumer probes
        shell: bash
        run: |
          set -o pipefail
          bash tool/consumers/native/run.sh | tee native-probe-${{ matrix.key }}.log
      - name: Upload native probe log
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-probe-${{ matrix.key }}
          path: native-probe-${{ matrix.key }}.log
          if-no-files-found: error
