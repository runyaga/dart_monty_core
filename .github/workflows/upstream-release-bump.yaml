name: Upstream release bump

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable upstream tag to bump, such as v1.2.0'
        required: false
        type: string
      dry_run:
        description: 'Prepare and validate the bump without publishing it'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: upstream-release-bump
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      run: ${{ steps.detect.outputs.run }}
      published: ${{ steps.prepare.outputs.published }}
      tag: ${{ steps.detect.outputs.tag }}
      branch: ${{ steps.detect.outputs.branch }}
      dry_run: ${{ steps.detect.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect a stable upstream tag
        id: detect
        env:
          TAG_INPUT: ${{ inputs.tag }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dry_run="$DRY_RUN_INPUT"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            dry_run=true
          fi
          [ "$dry_run" = true ] || dry_run=false
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            tag="$(python3 -I tool/bump_upstream.py latest-tag --pin tool/upstream/upstream-pin.json)"
          fi
          if [ -z "$tag" ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo '::error::tag must be a stable vN.N.N tag'; exit 1;
          }
          old_tag="$(python3 -I -c 'import json; print(json.load(open("tool/upstream/upstream-pin.json"))["tag"])')"
          if [ "$tag" = "$old_tag" ]; then
            echo "::notice::Upstream $tag is already pinned; no change needed."
            printf 'run=false\ntag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="bump/upstream-$tag"
          public_repo="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$public_repo" "$branch" >/dev/null 2>&1; then
            echo "branch $branch already exists"
            printf 'run=false\ntag=%s\nbranch=%s\n' "$tag" "$branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old_commit="$(python3 -I -c 'import json; print(json.load(open("tool/upstream/upstream-pin.json"))["commit"])')"
          old_cases_tree="$(python3 -I -c 'import json; p=json.load(open("tool/upstream/upstream-pin.json")); print(next(t["git_tree"] for t in p["trees"] if t["path"] == "crates/monty/test_cases"))')"
          printf 'run=true\ntag=%s\nbranch=%s\nold_tag=%s\nold_commit=%s\nold_cases_tree=%s\n' \
            "$tag" "$branch" "$old_tag" "$old_commit" "$old_cases_tree" >> "$GITHUB_OUTPUT"
      - name: Read follow evidence
        if: steps.detect.outputs.run == 'true'
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/upstream-follow-state"
          public_repo="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$public_repo" upstream-follow-state >/dev/null 2>&1; then
            git clone --depth 1 --branch upstream-follow-state "$public_repo" "$state_dir"
          else
            mkdir -p "$state_dir"
          fi
          if [ -f "$state_dir/evidence.jsonl" ]; then
            cp "$state_dir/evidence.jsonl" "$RUNNER_TEMP/evidence.jsonl"
          else
            : > "$RUNNER_TEMP/evidence.jsonl"
          fi
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        if: steps.detect.outputs.run == 'true'
        with:
          sdk: 3.13.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.detect.outputs.run == 'true'
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.detect.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        if: steps.detect.outputs.run == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Prepare the bump artifact
        id: prepare
        if: steps.detect.outputs.run == 'true'
        env:
          TAG: ${{ steps.detect.outputs.tag }}
          BRANCH: ${{ steps.detect.outputs.branch }}
          OLD_TAG: ${{ steps.detect.outputs.old_tag }}
          OLD_COMMIT: ${{ steps.detect.outputs.old_commit }}
          OLD_CASES_TREE: ${{ steps.detect.outputs.old_cases_tree }}
          DRY_RUN: ${{ steps.detect.outputs.dry_run }}
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          dart pub get
          mirror_rc=0
          # check_worker_mirror returns 1 for an expected candidate diff; 0 means no diff.
          python3 -I tool/check_worker_mirror.py --candidate "$TAG" > "$RUNNER_TEMP/mirror-diff.txt" || mirror_rc=$?
          if [ "$mirror_rc" -ne 0 ] && [ "$mirror_rc" -ne 1 ]; then
            exit "$mirror_rc"
          fi
          apply_rc=0
          # apply returns 3 only while the release is absent from PyPI; 0 completes the bump.
          python3 -I tool/bump_upstream.py apply --tag "$TAG" --core "$GITHUB_WORKSPACE" \
            --workdir "$RUNNER_TEMP/upstream-bump" || apply_rc=$?
          if [ "$apply_rc" -eq 3 ]; then
            echo "::notice::Upstream $TAG is not published on PyPI yet; retrying tomorrow."
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$apply_rc" -ne 0 ]; then
            exit "$apply_rc"
          fi
          (cd native/worker && cargo update --workspace)
          python3 -I tool/bump_upstream.py pin-lock --core "$GITHUB_WORKSPACE" \
            --version "${TAG#v}"
          bash tool/build_worker.sh
          bash tool/prebuild.sh
          bash tool/generate_proto.sh
          python3 -m venv .venv-oracle
          .venv-oracle/bin/python -m pip install -q --disable-pip-version-check --no-cache-dir \
            --require-hashes --only-binary :all: --no-deps -r tool/upstream/requirements.lock
          for generator in tool/generate_*_oracle.py; do
            .venv-oracle/bin/python -I "$generator"
          done
          new_cases_tree="$(python3 -I -c 'import json; p=json.load(open("tool/upstream/upstream-pin.json")); print(next(t["git_tree"] for t in p["trees"] if t["path"] == "crates/monty/test_cases"))')"
          if [ "$new_cases_tree" != "$OLD_CASES_TREE" ]; then
            dart tool/generate_fixture_corpus_v1.dart "$RUNNER_TEMP/upstream-bump/monty"
          fi
          bash tool/check_version_pin.sh
          python3 -I tool/check_worker_mirror.py --local
          python3 -I tool/check_upstream_pin.py
          body="$RUNNER_TEMP/pr-body.md"
          python3 -I tool/bump_upstream.py body --core "$GITHUB_WORKSPACE" --tag "$TAG" \
            --old-commit "$OLD_COMMIT" --old-tag "$OLD_TAG" --evidence "$RUNNER_TEMP/evidence.jsonl" \
            --mirror-diff "$RUNNER_TEMP/mirror-diff.txt" --out "$body"
          git add -A
          git -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "chore: prepare upstream monty $TAG"
          mkdir -p "$RUNNER_TEMP/bump"
          git bundle create "$RUNNER_TEMP/bump/bump.bundle" HEAD^..HEAD
          cp "$body" "$RUNNER_TEMP/bump/pr-body.md"
          cp "$RUNNER_TEMP/mirror-diff.txt" "$RUNNER_TEMP/bump/mirror-diff.txt"
          echo 'published=true' >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            {
              echo '## Prepared upstream bump (dry run)'
              echo '```text'
              git show --stat --oneline HEAD
              echo '```'
              echo
              cat "$body"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.prepare.outputs.published == 'true'
        with:
          name: upstream-bump
          path: ${{ runner.temp }}/bump
          if-no-files-found: error

  publish:
    needs: prepare
    if: needs.prepare.outputs.published == 'true' && needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: upstream-bump
          path: ${{ runner.temp }}/bump
      - name: Publish the bump and open a draft pull request
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bump/bump.bundle"
          body="$RUNNER_TEMP/bump/pr-body.md"
          git bundle verify "$bundle"
          git fetch "$bundle" HEAD:"refs/heads/$BRANCH"
          read -r -a commit_and_parents <<< "$(git rev-list --parents -n 1 "$BRANCH")"
          main="$(git rev-parse origin/main)"
          if [ "${#commit_and_parents[@]}" -ne 2 ] || [ "${commit_and_parents[1]:-}" != "$main" ]; then
            echo '::error::the bump commit is not one commit on the current main. Rerun the workflow.'
            exit 1
          fi
          push_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$push_url" "refs/heads/$BRANCH:refs/heads/$BRANCH"
          gh workflow run ci.yaml --ref "$BRANCH" -f force_all=true
          if ! gh pr create --draft --base main --head "$BRANCH" \
            --title "chore: bump upstream monty $TAG" --body-file "$body"; then
            printf '\nCompare: https://github.com/%s/compare/main...%s\n' \
              "$GITHUB_REPOSITORY" "$BRANCH" >> "$body"
            gh issue create --title "Upstream bump: $TAG" --body-file "$body"
          fi

  report-failure:
    needs: prepare
    if: failure() && github.ref == 'refs/heads/main' && needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report preparation failure
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            title="Upstream bump failed: $TAG"
          else
            title='Upstream bump failed: tag detection'
          fi
          body="Upstream bump failed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
