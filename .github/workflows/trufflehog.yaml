name: TruffleHog Secrets Scan

on:
  push:
    branches:
      - '**'
  # A pull request, fork or not, is scanned before it can merge.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads the repository's history; nothing else.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The action's own range for a push is `before..after`, and it skips the
      # scan when the push lists no commits. A force-pushed rebase does both
      # wrong: `before` is not an ancestor of `after`, and the scan reported
      # `"chunks": 0`. So the range is given explicitly, always from a commit
      # that is an ancestor of the head.
      - name: Resolve the commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base=''
          head=''
          case "$EVENT" in
            pull_request)
              # Every commit the PR adds over its base, however it was pushed.
              head=$PR_HEAD
              base=$(git merge-base "$PR_BASE" "$PR_HEAD")
              ;;
            push)
              head=$AFTER
              if [ "$BEFORE" != 0000000000000000000000000000000000000000 ] &&
                git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
                # A fast-forward: only the new commits.
                base=$BEFORE
              elif [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                # A new or force-pushed branch: everything not on the default
                # branch.
                base=$(git merge-base "origin/$DEFAULT_BRANCH" "$AFTER")
              fi
              # Otherwise the default branch was rewritten: its whole history.
              ;;
          esac
          if [ -n "$head" ] && [ "$base" = "$head" ]; then
            echo "No commits to scan: $head is already on the base."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Scanning ${base:-(root)}..${head:-(all branches)}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: TruffleHog scan
        if: steps.range.outputs.skip != 'true'
        # PINNED, was @main. A mutable branch ref on a secret scanner means
        # every run executes whatever is on that branch at that moment, with
        # repo read access -- the supply-chain shape this scanner exists to
        # find.
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --only-verified
          # The action runs the scanner as a Docker image, `latest` unless
          # told otherwise, so the SHA above pins only the wrapper script.
          # This pins the scanner: the 3.99.2 tag, held to its manifest-list
          # digest so a re-pushed tag cannot change it. Bump it with the SHA.
          version: 3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a

  notify-failure:
    runs-on: ubuntu-latest
    needs: [trufflehog]
    if: failure()
    timeout-minutes: 2
    # Posts to a Slack webhook; the GitHub token is not used.
    permissions: {}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_URL }}
    steps:
      # Built with jq, not by pasting expressions into JSON: a commit message
      # with a `"` or a backslash made the payload unparseable, and the alert
      # was lost exactly when it was needed.
      - name: Build the Slack payload
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg text ":rotating_light: $WORKFLOW failed on $BRANCH:"$'\n'"$MESSAGE"$'\n'"$RUN_URL" \
            '{channel: "#dart_monty_core", username: "dart_monty_core",
              text: $text, icon_emoji: ":ghost:"}' \
            > "$RUNNER_TEMP/slack-payload.json"
      - name: Notify Slack on failure
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        # The action reads the URL from SLACK_WEBHOOK_URL, but since v2 it
        # exits "Missing input!" unless webhook-type names the technique.
        with:
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
