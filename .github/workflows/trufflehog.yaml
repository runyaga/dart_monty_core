name: TruffleHog Secrets Scan

on:
  push:
    branches:
      - '**'
  # A pull request, fork or not, is scanned before it can merge.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads the repository's history; nothing else.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # The action's own range for a push is `before..after`, and it skips the
      # scan when the push lists no commits. A force-pushed rebase does both
      # wrong: `before` is not an ancestor of `after`, and the scan reported
      # `"chunks": 0`. So the range is given explicitly, always from a commit
      # that is an ancestor of the head.
      - name: Resolve the commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          base=''
          head=''
          skip=false
          case "$EVENT" in
            pull_request)
              # Every commit the PR adds over its base, however it was pushed.
              head=$PR_HEAD
              base=$(git merge-base "$PR_BASE" "$PR_HEAD")
              ;;
            push)
              head=$AFTER
              if [ "$AFTER" = "$zero" ]; then
                # A deleted branch: no commits.
                skip=true
              elif [ "$BEFORE" != "$zero" ] &&
                git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
                # A fast-forward: only the new commits.
                base=$BEFORE
              elif [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                # A new or force-pushed branch: everything not on the default
                # branch, or all of its history when it shares none with it.
                # merge-base exits 1 for no common ancestor, 128 for a bad
                # commit; only the first is a full scan.
                rc=0
                base=$(git merge-base "origin/$DEFAULT_BRANCH" "$AFTER") || rc=$?
                [ "$rc" -le 1 ] || exit "$rc"
              fi
              # Otherwise the default branch was rewritten: its whole history.
              ;;
          esac
          if [ "$skip" = true ]; then
            echo "No commits to scan: the push deleted the branch."
          elif [ -n "$head" ] && [ "$base" = "$head" ]; then
            echo "No commits to scan: $head is already on the base."
            skip=true
          else
            echo "Scanning ${base:-(root)}..${head:-(all branches)}"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: TruffleHog scan
        if: steps.range.outputs.skip != 'true'
        # PINNED, was @main. A mutable branch ref on a secret scanner means
        # every run executes whatever is on that branch at that moment, with
        # repo read access -- the supply-chain shape this scanner exists to
        # find.
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --only-verified
          # The action runs the scanner as a Docker image, `latest` unless
          # told otherwise, so the SHA above pins only the wrapper script.
          # This pins the scanner: the 3.99.2 tag, held to its manifest-list
          # digest so a re-pushed tag cannot change it. Bump it with the SHA.
          version: 3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a
