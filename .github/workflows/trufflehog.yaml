name: TruffleHog Secrets Scan

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: TruffleHog scan
        # PINNED, was @main. A mutable branch ref on a secret scanner means
        # every run executes whatever is on that branch at that moment, with
        # repo read access -- the supply-chain shape this scanner exists to
        # find. v3.97.4 is the current release (gh api .../releases/latest).
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          extra_args: --only-verified

  notify-failure:
    runs-on: ubuntu-latest
    needs: [trufflehog]
    if: failure()
    timeout-minutes: 2
    # Posts to a Slack webhook; the GitHub token is not used.
    permissions: {}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_URL }}
    steps:
      - name: Notify Slack on failure
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          payload: |
            {
              "channel": "#dart_monty_core",
              "username": "dart_monty_core",
              "text": ":rotating_light: ${{ github.workflow }} failed on ${{ github.head_ref || github.ref_name }}:\n${{ github.event.head_commit.message }}\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "icon_emoji": ":ghost:"
            }
