name: Worker nightly (macOS arm64)

# The worker crate's required CI is the ubuntu `worker-rust` job in ci.yaml.
# This runs the same build and smoke test on macOS arm64 once a night, to catch
# platform drift without putting a macOS runner on every PR. A PR that edits
# this file runs it too, so a change to it is tested before it merges.
on:
  schedule:
    - cron: '30 3 * * *'   # daily 03:30 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/worker-nightly.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  worker-macos:
    name: Worker crate (macOS arm64 build + smoke)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/worker
          key: worker-${{ hashFiles('native/worker/Cargo.lock') }}
      - name: Build executable + cdylib
        run: cargo build --locked --release --lib --bins
      - name: Smoke test (Configure, Feed 1 + 1, Shutdown)
        run: cargo test --locked --release

  # The upstream corpus on the macOS arm64 worker (C5-d): the same test as
  # ci.yaml's `corpus-worker` (Linux, every PR), once a night. Not a required
  # check. The worker is built here as tool/build_worker.sh builds it for
  # `dart test`, so the test runs the executable a consumer would get.
  corpus-macos:
    name: Upstream corpus (worker, macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.5
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            native
            native/worker
          key: corpus-${{ hashFiles('native/worker/Cargo.lock', 'native/Cargo.lock') }}
      - run: dart pub get
      - name: Build the worker executable
        run: bash tool/build_worker.sh
      - name: Corpus and crash recovery (native, macOS)
        run: bash tool/test_corpus_worker.sh native
