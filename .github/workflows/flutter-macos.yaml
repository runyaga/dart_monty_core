name: Flutter macOS worker delivery

# This is deliberately a separate workflow: it builds a real Flutter macOS
# app, but proves delivery with a headless Dart driver because CI cannot open
# its GUI window.
on:
  schedule:
    - cron: '40 4 * * *'   # daily 04:40 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'tool/flutter_macos/**'
      - '.github/workflows/flutter-macos.yaml'

permissions:
  contents: read

jobs:
  flutter-macos-probe:
    name: Flutter macOS probe
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native/worker
          key: flutter-macos-worker-${{ hashFiles('native/worker/Cargo.lock') }}
      # Keep this in lockstep with consumers.yaml: its bundled Dart is pinned
      # to the SDK this repository analyzes and formats with.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: false
      - name: Resolve Dart dependencies
        run: dart pub get
      - name: Build the macOS arm64 worker
        run: bash tool/build_worker.sh
      - name: Build, embed, sign, and probe the Flutter app bundle
        run: |
          set -o pipefail
          worker=lib/src/bin/macos-arm64/dart_monty_worker
          sha256=$(shasum -a 256 < "$worker" | awk '{print $1}')
          bash tool/flutter_macos/probe.sh --worker "$worker" --sha256 "$sha256" \
            2>&1 | tee flutter-macos-probe.log
      - name: Upload Flutter macOS probe log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flutter-macos-probe-log
          path: flutter-macos-probe.log
          if-no-files-found: warn
