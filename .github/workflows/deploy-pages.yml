name: Deploy GitHub Pages

on:
  # Dispatch only: the site is a static catalogue assembled from
  # repository files, and one Pages environment per repository means a
  # dispatch from any branch deploys to the LIVE site -- so publishing
  # stays a deliberate act, never a side effect of a push.
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deploy at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # deploy-pages publishes with an OIDC token: pages + id-token.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # ── Assemble site/ ──────────────────────────────────────────────────────
      # Standard-library Python: no Node, no Dart SDK, no package fetch, no
      # compiled artifacts. The builder reads repository files only
      # (docs/index.html, pubspec.yaml, tool/upstream/upstream-pin.json and
      # the example sources), verifies every local link and source copy as
      # it builds, and writes site/ ready to upload.
      - name: Assemble site
        run: python3 -B tool/build_pages.py

      # ── Deploy ──────────────────────────────────────────────────────────────
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
