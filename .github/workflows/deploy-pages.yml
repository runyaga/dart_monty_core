name: Deploy GitHub Pages

on:
  push:
    # Same gap as ci.yaml: the integration line could not publish its own docs.
    #
    # CONSEQUENCE, STATED RATHER THAN DISCOVERED: there is ONE GitHub Pages
    # environment per repository, so a push to integration/** deploys to the
    # LIVE site -- whichever branch pushed last is what visitors see. The
    # sibling repo also needed its `github-pages` environment branch policy
    # widened before this took effect; a green trigger and a green build still
    # deploy nothing if the environment excludes the branch.
    branches: [main, 'integration/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # ── Toolchains ──────────────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Same SDK as ci.yaml, so the site is built by the compiler the `pages`
      # job validated -- not whatever `stable` resolves to on deploy day.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      # ── Web REPL — uses committed assets (Mode A) ───────────────────────────
      # Assets live in assets/ and are committed to git. No cargo build or
      # node build.js step needed. CI's drift-check job guarantees the
      # committed assets match the Rust source on every PR.
      #
      # No npm install either: the worker supplies its own WASI imports
      # (js/src/wasm_glue.js), so nothing from js/node_modules is served.

      - name: Prepare web REPL assets
        run: |
          WEB=packages/dart_monty_web/web
          dart pub get
          cd packages/dart_monty_web && dart pub get && cd ../..
          cp lib/assets/dart_monty_core_bridge.js   $WEB/
          cp lib/assets/dart_monty_core_worker.js   $WEB/
          cp lib/assets/dart_monty_core_native.wasm $WEB/

      # ── Web REPL (dart2js) ───────────────────────────────────────────────────
      - name: Build web REPL (dart2js)
        run: |
          dart compile js packages/dart_monty_web/web/repl_demo.dart \
            -o packages/dart_monty_web/web/repl_demo.dart.js --no-source-maps

      # ── Web REPL (dart2wasm) ─────────────────────────────────────────────────
      - name: Build web REPL (dart2wasm)
        run: |
          dart compile wasm packages/dart_monty_web/web/repl_demo.dart \
            -o packages/dart_monty_web/web/repl_demo.wasm

      # ── Assemble site/ ───────────────────────────────────────────────────────
      # Flutter REPL demo removed: the dart_monty_flutter sidecar was deleted
      # under the Mode A asset refactor. The shim moves to dart_monty as
      # DartMonty.ensureInitialized(). A replacement Flutter demo can live in
      # dart_monty/example/ later if wanted.
      - name: Assemble site
        run: |
          mkdir -p site/repl
          cp -r packages/dart_monty_web/web/. site/repl/
          cp docs/index.html site/index.html

      # ── Deploy ───────────────────────────────────────────────────────────────
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
