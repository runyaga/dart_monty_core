tags:
  unit: {}
  # Cannot compile for the web at all — not merely wrong there. See
  # test/unit/platform/monty_value_int64_vm_test.dart for why a tag is not
  # enough on its own and the file must also be separate.
  vm-only: {}
  integration:
    skip: "Skipped by default (slow). Run: dart test --run-skipped --tags=integration"
  example:
    skip: "Example smoke tests. Run: dart test -p vm --run-skipped --tags=example"
  ladder:
    skip: "Skipped by default (slow). Run: dart test --run-skipped --tags=ladder"
  # The worker channels against real workers. Not skipped: the
  # browser half drives the COMMITTED lib/assets/dart_monty_core_worker
  # .{js,wasm}, served under packages/. Excluded from unit_web and run on its
  # own: bash tool/test_worker_web.sh
  # The native half (test/integration/worker/) spawns the executable from
  # tool/build_worker.sh; excluded from the VM unit runs and run on its own:
  # dart test test/integration/worker -p vm --tags=worker
  worker: {}
  # The pinned upstream corpus and the pool crash recovery on the worker:
  # dart test test/corpus -p vm --tags=corpus-worker (and -p chrome / firefox,
  # -c dart2js / dart2wasm). CI job `corpus-worker`. Carries `worker` too, so
  # the unit runs that exclude it never load these.
  corpus-worker: {}
  pending-futures:
    skip: "Pending feat/repl-future-capable. Run with --run-skipped --tags=pending-futures to confirm the spec is still failing."
