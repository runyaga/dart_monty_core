# protoc for tool/generate_proto.sh: grpcio-tools 1.84.0, which bundles
# libprotoc 35.1, pinned by content hash. Install ONLY with
#
#     pip install --require-hashes --only-binary :all: --no-deps -r tool/upstream/protoc-requirements.lock
#
# --no-deps is deliberate. `python -m grpc_tools.protoc` needs only the
# package's own compiled extension; grpcio, protobuf and setuptools are
# runtime dependencies of the gRPC Python codegen, which this repo does not
# use. tool/generate_proto.sh checks `--version` reports libprotoc 35.1.
#
# This is NOT tool/upstream/requirements.lock. That file is the reference
# oracle's lock, and the parity suite asserts it is byte-identical to its own
# copy, so a build tool cannot be added to it.
#
# Hashes are the sha256 digests PyPI publishes for each file: the sdist, and
# the wheels for CPython 3.12-3.14 on manylinux2014_x86_64 (CI) and
# macosx_11_0_universal2. A platform not listed here fails the install, by
# design; add its hash from PyPI rather than relaxing --require-hashes.
