formatter:
  page_width: 80

include:
  - package:very_good_analysis/analysis_options.10.2.0.yaml
  - dcm_options.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'build/**'
    - 'native/**'
    # The Flutter consumer probe needs the Flutter SDK, which the Dart-only
    # `gate` job does not install (package:flutter does not resolve here).
    # THE COMPENSATING CHECK is the `consumer-flutter-web` job in
    # .github/workflows/consumers.yaml, which runs `flutter analyze` on it.
    - 'tool/consumers/flutter_web/**'
    # protoc_plugin output (tool/generate_proto.sh). Generated: nobody edits it, so its lints are the generator's style,
    # not ours (2,464 infos, all of them public_member_api_docs, trailing
    # commas and the like). THE COMPENSATING CHECK is CI's `proto-drift` job,
    # which regenerates it with the pinned protoc, plugin and SDK and fails on
    # any diff -- so what is excluded here is provably the generator's output
    # and nothing hand-written. DCM reads this list too.
    - 'lib/src/worker/proto/**'
    - 'packages/dart_monty_flutter/**'
    - 'packages/dart_monty_web/**'
    - 'example/**'
    # Assembled GitHub Pages output (deploy-pages.yml). It is a COPY of
    # packages/dart_monty_web/web, which is already excluded above, so
    # analysing it would double-report that package's issues. `.gitignore`
    # does not help here — the analyzer does not consult it.
    - 'site/**'
    # Agent worktrees (`git worktree add .claude/worktrees/...`). Each is a
    # FULL checkout of this package nested inside it, so without this the
    # analyzer walks N extra copies of lib/ and test/ — and reports their
    # issues against THIS package, at paths that do not exist on this branch.
    #
    # THE COMPENSATING STEP IS THAT THERE IS NOTHING TO COMPENSATE FOR: unlike
    # a normal exclusion, this hides no code from analysis. Every file under a
    # worktree is the same package analysed in its own root, by its own
    # `dart analyze` / gate run, against its own branch. Excluding it here
    # removes duplicate reporting, not coverage.
    #
    # Measured 2026-08-03: a worktree agent's gate went red with
    # `Error when reading 'lib/src/mount/vfs_limits.dart': No such file or
    # directory` — a file that exists on one branch and not another, surfaced
    # because two checkouts were in one analysis scope. Five stale worktrees
    # were live at the time.
    - '.claude/worktrees/**'

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    invalid_annotation_target: error

linter:
  rules:
    public_member_api_docs: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    cancel_subscriptions: false
    one_member_abstracts: false
