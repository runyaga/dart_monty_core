# =============================================================================
# DCM Configuration — dart_monty_core
# =============================================================================

dcm:
  metrics:
    cyclomatic-complexity:
      threshold: 10
    lines-of-code:
      threshold: 50
    number-of-parameters:
      threshold: 6
    maximum-nesting-level:
      threshold: 4
    number-of-methods:
      threshold: 15
    weight-of-a-class:
      threshold: 15.0

  exclude:
    metrics:
      - "**/*.g.dart"
      - "**/*.freezed.dart"
      - "build/**"
      - "native/**"
      - "test/**"
    rules:
      - "**/*.g.dart"
      - "**/*.freezed.dart"

  rules:
    # --- Bug Prevention ---
    - avoid-throw-in-finally-block
    - avoid-unsafe-collection-methods:
        exclude:
          # Two index reads, both provably in bounds:
          #   lines[startIdx] in captureLastExpression -- startIdx comes
          #     from _findExpressionStart and lies in [0, lastIdx], and
          #     lastIdx >= 0 has already been checked.
          #   lines[i] in _findExpressionStart -- i walks lastIdx..0 and
          #     the loop accumulates bracket depth across iterations, which
          #     no single Iterable expression states as plainly.
          # elementAtOrNull(i)! would trade a RangeError for a TypeError
          # without removing the risk, so the loop form is kept.
          - "lib/src/platform/code_capture.dart"
    - avoid-missing-completer-stack-trace
    - avoid-uncaught-future-errors
    - avoid-recursive-calls
    - avoid-contradictory-expressions
    - avoid-self-assignment
    - avoid-unused-assignment
    - avoid-unassigned-late-fields
    - no-equal-arguments
    - no-equal-conditions

    # --- Code Quality ---
    - avoid-collapsible-if
    - avoid-redundant-else
    - avoid-unnecessary-conditionals
    - avoid-unnecessary-overrides
    - avoid-shadowing
    - avoid-only-rethrow
    - avoid-identical-exception-handling-blocks
    - prefer-early-return
    - prefer-returning-condition
    - move-variable-closer-to-its-usage

    # --- Error Handling & Variables ---
    - avoid-throw-objects-without-tostring
    - avoid-non-final-exception-class-fields
    - prefer-correct-error-name
    - avoid-unnecessary-local-variable
    - avoid-unnecessary-reassignment
    - avoid-mutating-parameters
    - avoid-unused-local-variable
    - avoid-nested-try-statements
    - avoid-missing-interpolation
    - prefer-correct-identifier-length

    # --- Robustness & Correctness ---
    - avoid-unsafe-reduce
    - avoid-map-keys-contains
    - prefer-contains
    - avoid-duplicate-map-keys
    - avoid-duplicate-patterns
    - avoid-equal-expressions
    - avoid-constant-conditions
    - no-equal-switch-case
    - no-equal-switch-expression-cases
    - no-equal-nested-conditions

    # --- Common Anti-Patterns ---
    - avoid-unused-parameters
    - avoid-nested-conditional-expressions
    - avoid-missing-enum-constant-in-map
    - avoid-unnecessary-type-assertions
    - avoid-unnecessary-type-casts
    - avoid-unrelated-type-assertions
    - avoid-redundant-async
    - avoid-duplicate-exports
    - avoid-collection-methods-with-unrelated-types
    - avoid-passing-async-when-sync-expected

    # --- Style & Formatting ---
    - prefer-match-file-name:
        exclude:
          # test/** (6 issues, VERIFIED 2026-09-15). Test files are named for
          # what they TEST, not for the first type they declare, and helpers
          # declare support types first: _hierarchy_registry.dart:54 opens with
          # `class WireFixture`, monty_compile_test.dart:18 with
          # `final class _ThrowingBindings`. Renaming either to satisfy the rule
          # would make the file harder to find, which is the opposite of what
          # the rule exists for.
          - "test/**"
          # Result types declared before the abstraction they belong to, so the
          # FIRST class is never the file's name. VERIFIED 2026-09-15:
          #   native_bindings.dart -> RunResult, ProgressResult,
          #                           WireFormatMismatch, then NativeBindings
          #   wasm_bindings.dart   -> WasmRunResult, WasmProgressResult,
          #                           WasmDiscoverResult, then WasmBindings
          # (The previous comment here said "Multiple typedefs + class".
          # Neither file declares a single typedef — `grep -c '^typedef ' -> 0`
          # on both. They are classes.)
          - "lib/**/native_bindings.dart"
          - "lib/**/wasm_bindings.dart"
          # Part files: first type is a sealed subclass, not the file name.
          # VERIFIED: all four are `part of`, first types are MontyNone,
          # MontyBytes, MontyDate, MontyEllipsis respectively.
          - "lib/src/platform/monty_value_scalars.dart"
          - "lib/src/platform/monty_value_collections.dart"
          - "lib/src/platform/monty_value_datetime.dart"
          - "lib/src/platform/monty_value_structured.dart"
          # Helper types declared before the main class: CoreRunResult and
          # CoreProgressResult precede MontyCoreBindings.
          - "lib/src/platform/core_bindings.dart"
          # NOT the same reason, despite sitting under that heading until
          # 2026-09-15. This file declares exactly ONE class and nothing
          # precedes it. It is the VM half of a conditional import: it must be
          # named `WasmBindingsJs` to stand in for wasm_bindings_js.dart (see
          # monty_wasm.dart:10), and it must live at a DIFFERENT path because
          # both halves coexist. Class name forced, file name forced, mismatch
          # structural. This one can never be fixed, only excluded.
          - "lib/src/wasm/wasm_bindings_js_stub.dart"
          # MockCallHistory (:17) is declared before MockMontyPlatform (:132).
          - "lib/src/platform/mock_monty_platform.dart"
    - prefer-immediate-return
    - prefer-commenting-analyzer-ignores
    - prefer-conditional-expressions
    - prefer-trailing-comma
    - prefer-moving-to-variable
    - newline-before-return
    - no-boolean-literal-compare
    - no-empty-block:
        exclude:
          # _ThrowingBindings is a compile-error stub; dispose is deliberately
          # a no-op to satisfy MontyCoreBindings.
          #
          # lib/src/platform/monty_platform.dart was listed here until
          # 2026-09-15 for an "intentional no-op dispose". Measured: with the
          # entry removed the rule reports ZERO issues in that file, so it was
          # hiding nothing -- the same dormant-exclusion shape as the
          # monty_session.dart entry deleted in 24a31da.
          - "test/unit/platform/monty_compile_test.dart"
    - no-equal-then-else
    - prefer-first
    - prefer-last
    - binary-expression-operand-order
    - double-literal-format

    # --- Style Consistency ---
    - prefer-switch-expression
    - avoid-unnecessary-parentheses
    - prefer-async-await:
        exclude:
          # VERIFIED 2026-09-15, both sites still earn it:
          #   :538 `await f.timeout(5s).then((_) => true).onError((_,_) => false)`
          #        -- a timeout-or-false chain; async/await needs an explicit
          #        try/catch on TimeoutException to say the same thing.
          #   :581 isolate message dispatch, returning completer.future.then(...)
          #        from a non-async function.
          - "lib/src/ffi/native_isolate_bindings_impl.dart"
    - avoid-adjacent-strings
    - prefer-declaring-const-constructor
    - format-comment

    # --- Immutability ---
    - prefer-final-fields

    # --- Async & Type Safety ---
    - avoid-nested-futures
    - avoid-nested-streams-and-futures
    - prefer-return-await
    - avoid-type-casts
    - avoid-inferrable-type-arguments
    - avoid-unnecessary-futures:
        exclude:
          # FALSE POSITIVES, and measured one at a time rather than assumed.
          # MontyCallback and OsCallHandler (lib/src/externals.dart:12-32) both
          # declare `Future<Object?> Function(...)`, NOT FutureOr. A callback
          # that returns an ordinary value can only satisfy that with `async`:
          # removing it gives "The returned type 'String' isn't returnable from
          # a 'Future<Object?>' function".
          #
          # NOT a blanket claim about the rule. All 21 originally flagged sites
          # were tested individually by removing only `async` and analysing:
          # five COMPILED without it (throwing callbacks -- `throw` is `Never`,
          # which satisfies Future<Object?> directly) and those five were FIXED
          # in 92ff680. These sixteen are the ones that genuinely cannot be.
          #
          # The alternative remedy -- widening the typedefs to
          # FutureOr<Object?> -- is a public API change to a published package
          # to silence a lint. Rejected.
          #
          # WHAT THIS COSTS: a future genuinely-unnecessary Future in these
          # nine files will not be reported. Per-site `// ignore:` was tried
          # first and abandoned: DCM re-anchors the finding onto the comment
          # line, so the suppression does not take.
          - "test/integration/_dataclass_hydrate_test_body.dart"
          - "test/integration/_monty_compile_run_test_body.dart"
          - "test/integration/_monty_exec_externals_test_body.dart"
          - "test/integration/_print_callback_test_body.dart"
          - "test/integration/_repl_extfns_lifecycle_test_body.dart"
          - "test/integration/ffi_datetime_oscall_test.dart"
          - "test/integration/ffi_repl_oscall_test.dart"
          - "test/integration/repros/issue_32_listcomp_global_clobber_ffi_test.dart"
          - "test/integration/wasm_datetime_oscall_test.dart"
    - prefer-correct-future-return-type
    - avoid-future-tostring
    - avoid-nullable-tostring
    - dispose-class-fields

    # --- Null Safety & Types ---
    - avoid-late-keyword:
        exclude:
          # test/** (12 issues, VERIFIED 2026-09-15). Every one is the standard
          # `late T x;` + `setUp(() { x = ...; })` pair -- e.g.
          # repl_platform_args_test.dart:21-22. This one is not just tolerated,
          # it is the RIGHT trade: dropping `late` means making the field
          # nullable and writing `x!` at every use, which swaps this rule for
          # avoid-non-null-assertion and makes the failure mode worse (a null
          # deref deep in a test instead of a LateInitializationError naming the
          # field that setUp forgot).
          - "test/**"
    - avoid-dynamic:
        exclude:
          # lib/ is CLEAN of `dynamic` in list positions as of 2026-09-15.
          # Seven files were listed here; all 21 sites were `List<dynamic>` at
          # JSON-decode boundaries and are now `List<Object?>`. That is not a
          # cosmetic swap: `dynamic` silences static checking at every use of
          # the element, while `Object?` keeps it and forces the cast to be
          # written where the type is actually narrowed. The runtime behaviour
          # is identical -- a List<dynamic> from json.decode satisfies
          # `is List<Object?>` -- which is why `dart analyze` stayed clean
          # without touching a single consumer.
          #
          # `Map<String, dynamic>` is NOT flagged by this rule and is left
          # alone: it is the canonical json.decode return type and rewriting it
          # would touch 39 sites for no checking benefit.
          #
          # test/** (3 issues, VERIFIED 2026-09-15 by reading all three) is a
          # separate judgement from the lib/ cleanup above, and they are not
          # one kind:
          #   monty_value_test.dart:858   `MontyValue.fromJson(<dynamic>[1, 'x'])`
          #   inputs_encoder_test.dart:88 `toPythonLiteral(<dynamic>[])`
          #     Explicit type arguments on list literals whose elements really
          #     ARE heterogeneous (or absent). `<Object?>[1, 'x']` would work
          #     and say the same thing, so these two are fixable -- they are
          #     simply not worth a churn commit on their own.
          #   monty_compile_test.dart:35  `dynamic noSuchMethod(Invocation)`
          #     NOT fixable. Dart imposes that signature; narrowing the return
          #     type does not compile.
          - "test/**"
    - avoid-non-null-assertion:
        exclude:
          # test/** (75 issues). CLASSIFIED ALL 75, 2026-09-15 -- an earlier
          # version of this comment generalised from three samples and got the
          # dominant shape wrong. The real split:
          #
          #     43  `*OrNull!`  -- firstOrNull!/elementAtOrNull(n)!/singleOrNull!
          #     17  a `!` immediately after the expect() that proves it
          #     15  other
          #
          # THE 43 ARE AN ARTEFACT OF THIS CONFIG, not a style choice, and that
          # is the part worth knowing. avoid-unsafe-collection-methods IS
          # enforced in test/ (its only exclusion is one lib file), while
          # avoid-non-null-assertion is NOT. So `args.first as int` is flagged
          # and `args.firstOrNull! as int` is invisible -- and the invisible one
          # is WORSE: on an empty list it throws "Null check operator used on a
          # null value", naming nothing, where `.first` throws
          # StateError("No element"), naming the problem.
          #
          # The evidence that the config drove this: test/ contains ZERO
          # avoid-unsafe-collection-methods issues and 43 `*OrNull!`. Nobody
          # chose the worse error message 43 times; the lint chose it for them.
          #
          # Left as-is deliberately. Fixing it is not 43 edits -- `.first`
          # would then be flagged, so it also needs a decision about
          # avoid-unsafe-collection-methods in test/ (where StateError("No
          # element") is arguably exactly what a test should get). That is a
          # policy call, not a cleanup.
          #
          # The 17 expect-guarded ones are genuinely fine: if the `!` could
          # fire, the expect above it already failed.
          - "test/**"
          # The ONLY remaining `!` in lib/. assignmentPattern is
          # RegExp(r'^([a-zA-Z]\w*)\s*=[^=]') -- group 1 is not optional, so a
          # successful match always has it, and Match.group returns String?
          # regardless. There is no form of this that drops the assertion.
          #
          # The other five files were listed here until 2026-09-15. Every `!`
          # in them is gone: field reads hoisted into promotable locals
          # (monty_progress, base_monty_platform, wasm_core_bindings,
          # native_isolate_bindings_impl) and an explicit StateError at the JS
          # boundary (wasm_bindings_js). Promotion is also STRICTER than the
          # assertion was: a local cannot be reassigned between the null check
          # and the use, which `_exitCompleter!` and `_sessionId!` both allowed.
          - "lib/src/platform/code_capture.dart"
    - avoid-accessing-other-classes-private-members
    - avoid-default-tostring
    - prefer-abstract-final-static-class
    - avoid-suspicious-super-overrides
    - avoid-unnecessary-constructor
    - avoid-shadowed-extension-methods
    - avoid-duplicate-mixins
    - avoid-referencing-subclasses
    - match-getter-setter-field-names:
        exclude:
          # dartValue getter intentionally wraps value field (sealed MontyValue API)
          - "lib/src/platform/monty_value_scalars.dart"
          - "lib/src/platform/monty_value_collections.dart"
          - "lib/src/platform/monty_value_structured.dart"
          # coreBindings getter wraps _bindings (protected API for subclasses)
          - "lib/src/platform/base_monty_platform.dart"
    - avoid-declaring-call-method

    # --- Import Safety ---
    - avoid-banned-imports:
        entries:
          - paths: ["lib/"]
            deny:
              - "package:flutter/material.dart"
              - "package:flutter/widgets.dart"
              - "package:flutter/cupertino.dart"
            message: "dart_monty_core is a pure Dart package — no Flutter imports."
    - avoid-global-state

    # --- Member Ordering ---
    - member-ordering:
        order:
          - constructors
          - public-fields
          - private-fields
          - get-setters
          - public-methods
          - private-methods
          - overridden-methods
        exclude:
          # _fieldsEqual helper placed adjacent to operator== that uses it;
          # strict re-ordering would harm readability
          - "lib/src/platform/monty_value_datetime.dart"
          - "lib/src/platform/monty_stack_frame.dart"
          # _nextReplId() is a constructor helper; grouping it with the
          # counter field it mutates is clearer than moving it to the end
          - "lib/src/repl/wasm_repl_bindings.dart"

    # --- Testing ---
    - prefer-test-matcher
    - prefer-correct-test-file-name
